<script>
document.documentElement.style.visibility='hidden';function installHelixUi(){return new Promise((resolve,reject)=>{const paths=['/vip/helix-ui/css/tokens.css','/vip/helix-ui/css/components.css','/vip/helix-ui/css/portal-adapter.css'];let left=paths.length;for(const href of paths){const link=document.createElement('link');link.rel='stylesheet';link.href=href;link.onload=()=>{if(--left===0)resolve()};link.onerror=()=>reject(new Error('HELIX UI assets could not be loaded'));document.head.append(link)}const helper=document.createElement('script');helper.src='/vip/helix-ui/js/helix-ui.js?v=member-canary-icon-dark-20261012';helper.defer=true;document.head.append(helper)})}
const sb=supabase.createClient('https://wouwoefzghecuiknznvs.supabase.co','sb_publishable_FDLLBcmYFGiS9PDbyvgDtQ_UWUB8fUc'),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),safeUrl=s=>{try{const u=new URL(s);return u.protocol==='https:'&&!u.username&&!u.password?u.href:''}catch{return ''}},fmt=d=>d?new Date(d).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}):'—';
const menus=[['dashboard','Dashboard','home'],['licenses','My Licenses','key'],['accounts','MT5 Accounts','monitor'],['activity','License Activity','activity'],['announcements','Announcements','megaphone'],['materials','Materials','book'],['profile','My Profile','user']];let state={page:'dashboard',data:null,performance:null};let activityPage=1;const activityPageSize=10;
function productCatalog(){const products=state.data.products||[];if(!products.length)return '';return `<section class="panel section">${head('key','Katalog Produk','Status akses dihitung dari seluruh license aktif akun Anda.')}${products.map(p=>`<article class="item-row"><span class="item-icon">${p.access_status==='OWNED'?'✓':'▣'}</span><div><div class="item-title">${esc(p.display_name)}</div><div class="item-copy">${esc(p.description||'')}</div><div class="item-meta">${p.eligible_license_ids.length?`Entitlement: ${p.eligible_license_ids.length} license`:'Belum termasuk license Anda'}</div></div>${badge(p.access_status)}</article>`).join('')}</section>`}
function memberSlotCard(){const s=state.data.slot_pool;if(!s)return '';return `<section class="panel section">${head('monitor','Kuota Akun MT5','Pool berlaku untuk semua produk dan license pada akun member ini.')}<div class="stat"><strong class="stat-value">${s.used}/${s.total}</strong><span class="stat-note">Akun kanonis menggunakan slot · batas konfigurasi ${s.configured_max}</span></div></section>`}
function toast(text,error=false){const n=document.createElement('div');n.className='toast'+(error?' error':'');n.textContent=text;document.body.append(n);setTimeout(()=>n.remove(),4500)}
async function api(path,body,method){const{data:{session}}=await sb.auth.getSession();const r=await fetch('/vip/api/'+path,{method:method||(body?'POST':'GET'),headers:{authorization:'Bearer '+session.access_token,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.message||d.error||'Permintaan gagal');return d}
function nav(){ $('#nav').innerHTML=menus.map(([id,label,ico])=>`<button data-page="${id}" class="${id===state.page?'active':''}"><img class="hx-icon" src="/vip/helix-ui/icons/${ico}.svg" alt="">${label}</button>`).join('') }
const hero=(title,sub,tag='MEMBER WORKSPACE')=>`<section class="hero"><div class="hero-copy"><div class="eyebrow">${tag}</div><h1>${title}</h1><p>${sub}</p></div></section>`;
const head=(icon,title,sub,action='')=>{const icons={ 'License Saya':'key','Akun Tersinkron':'monitor','MT5 Accounts':'monitor','Riwayat Aktivitas':'activity','Announcement Terbaru':'megaphone','Pengumuman HELIX':'megaphone','Material & Tutorial':'book','Panduan & File':'book','Profil Saya':'user','Aktivasi HELIX':'shield','Trading Performance':'chart' };return `<div class="panel-head"><div><h2 class="panel-title"><img class="hx-icon" src="/vip/helix-ui/icons/${icons[title]||'info'}.svg" alt="">${title}</h2>${sub?`<div class="panel-sub">${sub}</div>`:''}</div>${action}</div>`};
const empty=(title,copy)=>`<div class="empty"><strong>${title}</strong>${copy}</div>`;
const badge=s=>`<span class="status ${['suspended','revoked','expired'].includes(String(s).toLowerCase())?'bad':String(s).toLowerCase()==='pending'?'warn':''}">${esc(s||'—')}</span>`;
function licenseCards(){const {licenses,bindings}=state.data;if(!licenses.length)return `<section class="panel">${head('⚿','License Saya','License aktif Anda tampil di sini setelah Admin menerbitkannya.')}${empty('Belum ada license','Hubungi Admin HELIX untuk mendapatkan license.')}</section>`;return `<section class="panel">${head('⚿','License Saya','License dan entitlement member yang tercatat di server.')}${licenses.map(l=>{const used=bindings.filter(b=>b.license_id===l.id&&b.release_state!=='released').length;return `<article class="item-row"><span class="item-icon">⚿</span><div><div class="item-title">HELIX ${esc(l.product_slug).toUpperCase()}</div><div class="item-copy">${esc(l.license_key_hint)} · ${used}/${l.max_accounts} slot terpakai</div><div class="item-meta">Berakhir ${fmt(l.expires_at)}</div></div>${badge(l.effective_status||l.status)}</article>`}).join('')}</section>`}
function accountTable(includeReleased=true){const b=state.data.bindings.filter(x=>includeReleased||!(x.release_state==='released'||x.binding_status==='RELEASED'||x.released_at)), licenses=state.data.licenses;if(!b.length)return empty('Belum ada akun MT5 tersinkron','Setelah pairing OTP disetujui, akun yang tervalidasi server muncul di sini.');const v18k=state.data.release_ack_v18k;return `<div class="table-wrap"><table><thead><tr><th>Broker / Server</th><th>Login</th><th>License</th><th>Mode</th>${v18k?'<th>Status / Terminal</th>':''}<th>Last Sync</th><th>Aksi</th></tr></thead><tbody>${b.map(x=>{const status=x.binding_status||(x.released_at?'RELEASED':'ACTIVE'),terminal=x.terminal_status||'—';return `<tr><td>${esc(x.broker_server)}</td><td>${esc(x.account_login)}</td><td>${esc(licenses.find(l=>l.id===x.license_id)?.product_slug||'HELIX')}</td><td>${esc(x.mode)}</td>${v18k?`<td>${esc(status)}<div class="panel-sub">Terminal ${esc(terminal)}</div></td>`:''}<td>${fmt(x.last_sync_at)}</td><td>${status==='RELEASED'?'<span class="panel-sub">—</span>':`<button class="btn btn-danger" data-release-binding="${x.id}" ${status==='PENDING RELEASE'?'disabled':''}>${status==='PENDING RELEASE'?'Menunggu ACK':'Lepas'}</button>`}</td></tr>`}).join('')}</tbody></table></div>`}
function dashboard(){const d=state.data,m=d.member,active=d.licenses.filter(l=>l.status==='active'&&new Date(l.expires_at)>new Date()).length,usedBindings=d.bindings.filter(b=>b.release_state!=='released'&&b.binding_status!=='RELEASED'&&!b.released_at);return `${hero(`Selamat datang, <span class="gold">${esc(m.display_name||m.email.split('@')[0])}</span>`,'Kelola license, akun tersinkron, dan akses seluruh materi HELIX dalam satu tempat.')}<aside class="risk-notice" role="note" aria-label="Peringatan risiko trading"><span class="risk-notice-icon" aria-hidden="true">!</span><div class="risk-notice-copy"><strong>HELIX tidak menjanjikan profit.</strong><p>EA HELIX tidak menjanjikan profit atau hasil tertentu. Kinerja masa lalu maupun rancangan strategi tidak menjamin hasil di masa depan. Trading memiliki risiko kerugian, termasuk kehilangan modal. Lakukan riset sendiri dan pahami risikonya sebelum menggunakan EA, terutama pada akun real.</p><p>Untuk panduan instalasi dan penggunaan, silakan baca tutorial di menu Material.</p></div><button class="btn btn-quiet risk-notice-action" data-page="materials" type="button">Buka Material <span aria-hidden="true">→</span></button></aside><section class="stats"><article class="stat"><span class="stat-label">Status Akun</span><strong class="stat-value">VIP Member</strong><span class="stat-note">Akun terverifikasi</span></article><article class="stat stat-link" role="link" tabindex="0" aria-label="Buka My Licenses" data-page="licenses"><span class="stat-label">Total License Saya</span><strong class="stat-value">${d.licenses.length}</strong><span class="stat-note">${active} aktif · ${d.licenses.length-active} lainnya</span></article><article class="stat"><span class="stat-label">Next Sync</span><strong class="stat-value">—</strong><span class="stat-note">Sinkronisasi dari HELIX Engine</span></article><article class="stat stat-link" role="link" tabindex="0" aria-label="Buka MT5 Accounts" data-page="accounts"><span class="stat-label">Akun Tersinkron</span><strong class="stat-value">${usedBindings.length}</strong><span class="stat-note">${usedBindings.length} slot terpakai</span></article></section><div class="dashboard-grid">${licenseCards()}<section class="panel">${head('▣','Akun Tersinkron','Akun MT5 yang sudah dikonfirmasi oleh server.')}${accountTable(false)}</section></div><div class="content-grid"><section class="panel">${head('♢','Announcement Terbaru','Pengumuman resmi dari Admin HELIX.')} ${announcementRows(d.announcements.slice(0,3))}<button class="btn" data-page="announcements">Lihat semua →</button></section><section class="panel">${head('▤','Material & Tutorial','Panduan resmi untuk instalasi dan penggunaan HELIX.')} ${materialRows(d.materials.slice(0,3))}<button class="btn" data-page="materials">Lihat semua →</button></section></div><section class="panel" style="margin-top:13px">${profileSummary()}</section>`}
const contentKinds={announcement:{update:'Pembaruan Produk',maintenance:'Maintenance',information:'Informasi',general:'Umum'},material:{video:'Video',guide:'Panduan',file:'File',strategy:'Strategi'}};
function contentTools(type){const labels=contentKinds[type],all=Object.keys(labels);return `<div class="content-tools"><input class="input" data-content-search="${type}" type="search" placeholder="Cari ${type==='announcement'?'judul atau isi pengumuman':'nama atau deskripsi material'}…" aria-label="Cari ${type}"><select class="input" data-content-kind="${type}" aria-label="Filter kategori"><option value="">Semua kategori</option>${all.map(k=>`<option value="${k}">${labels[k]}</option>`).join('')}</select></div>`}
function categoryGroups(rows,type,renderRow){if(!rows.length)return '';const labels=contentKinds[type];return Object.entries(labels).map(([kind,label])=>{const group=rows.filter(x=>x.kind===kind);return group.length?`<section class="content-category" data-content-group="${type}"><h3>${label}<span>${group.length}</span></h3><div class="item-list">${group.map(renderRow).join('')}</div></section>`:''}).join('')}
function announcementRows(rows,withTools=false){if(!rows.length)return empty('Belum ada pengumuman','Pengumuman baru akan tampil di sini.');return `${withTools?contentTools('announcement'):''}${categoryGroups(rows,'announcement',a=>{const intro=String(a.body||'').split(/\r?\n/).map(x=>x.trim()).find(Boolean)||'';const summary=intro.length>190?intro.slice(0,187)+'…':intro;return `<button class="item-row announcement-card" data-kind="${esc(a.kind)}" data-announcement-open="${esc(a.id)}"><span class="item-icon">♢</span><span class="announcement-summary"><span class="item-title">${esc(a.title)}</span><span class="item-copy">${esc(summary)}</span><span class="item-meta">${esc(contentKinds.announcement[a.kind]||a.kind)} · ${fmt(a.published_at||a.created_at)} · Klik untuk membaca</span></span><span class="announcement-arrow" aria-hidden="true">›</span></button>`})}`}
function materialRows(rows,withTools=false){if(!rows.length)return empty('Belum ada material','Admin akan membagikan panduan dan file di halaman ini.');return `${withTools?contentTools('material'):''}${categoryGroups(rows,'material',a=>{const url=safeUrl(a.storage_path),privateFile=a.storage_path?.startsWith('helix-vip-materials:');return `<article class="item-row" data-kind="${esc(a.kind)}"><span class="item-icon">▤</span><div><div class="item-title">${esc(a.title)}</div><div class="item-copy">${esc(a.description)}</div><div class="item-meta">${esc(contentKinds.material[a.kind]||a.kind)}</div></div>${privateFile?`<button class="btn btn-quiet" data-download="${esc(a.id)}">Download ↓</button>`:url?`<a class="btn btn-quiet" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Buka ↗</a>`:''}</article>`})}`}
function filterContent(type){const term=(document.querySelector(`[data-content-search="${type}"]`)?.value||'').trim().toLocaleLowerCase('id'),kind=document.querySelector(`[data-content-kind="${type}"]`)?.value||'';document.querySelectorAll(`[data-content-group="${type}"]`).forEach(group=>{let visible=0;group.querySelectorAll('.item-row').forEach(row=>{const matches=(!term||row.textContent.toLocaleLowerCase('id').includes(term))&&(!kind||row.dataset.kind===kind);row.hidden=!matches;if(matches)visible++});group.hidden=visible===0})}
function showAnnouncement(id){const a=state.data.announcements.find(x=>x.id===id);if(!a)return;$('#overlay').innerHTML=`<div class="modal-backdrop"><section class="modal announcement-modal" role="dialog" aria-modal="true" aria-labelledby="announcement-title"><header class="modal-head"><div><div class="eyebrow">${esc(contentKinds.announcement[a.kind]||'PENGUMUMAN HELIX')}</div><h2 id="announcement-title">${esc(a.title)}</h2><div class="panel-sub">${fmt(a.published_at||a.created_at)}</div></div><button class="btn btn-quiet" type="button" data-close aria-label="Tutup">Tutup</button></header><div class="modal-body"><div class="announcement-full">${esc(a.body)}</div></div><footer class="modal-foot"><button class="btn btn-primary" type="button" data-close>Tutup</button></footer></section></div>`}
function profileSummary(){const m=state.data.member;const name=m.display_name||'HELIX Member';return `${head('♙','Profil Saya','Informasi dan pengaturan keamanan akun.') }<div class="profile-grid"><div class="profile-col"><div class="profile-identity"><div class="avatar" style="width:60px;height:60px;font-size:25px">${esc(name[0].toUpperCase())}</div><div class="profile-identity-copy"><div class="profile-name">${esc(name)}</div><button class="btn btn-quiet" type="button" data-edit-profile-name style="margin:7px 0">Ubah nama</button><div class="panel-sub">${esc(m.email)}</div><span class="role-pill" style="display:inline-flex;margin-top:9px"><img src="/vip/helix-ui/icons/crown.svg" alt=""> VIP Member</span></div></div></div><div class="profile-col"><div class="setting"><span>Status akun</span><strong>Member terdaftar</strong></div><div class="setting"><span>Akses</span><strong>VIP Member</strong></div></div><div class="profile-col"><button class="btn btn-quiet" data-reset style="width:100%;margin:5px 0">Kirim link reset password</button><button class="btn btn-quiet" data-change-email style="width:100%;margin:5px 0">Minta ganti email</button><button class="btn btn-quiet" data-logout style="width:100%;margin:5px 0">KELUAR</button></div></div>`}
function activityRows(){const events=state.data.events||[],pages=Math.max(1,Math.ceil(events.length/activityPageSize));activityPage=Math.min(activityPage,pages);if(!events.length)return empty('Belum ada aktivitas','Event license akan dicatat setelah terjadi aktivasi atau sinkronisasi.');return `${events.slice((activityPage-1)*activityPageSize,activityPage*activityPageSize).map(e=>`<article class="item-row"><span class="item-icon">◷</span><div><div class="item-title">${esc(e.event_type)}</div><div class="item-copy">${esc(JSON.stringify(e.metadata||{}))}</div><div class="item-meta">${fmt(e.created_at)}</div></div></article>`).join('')}<div class="filterbar"><span class="panel-sub">Halaman ${activityPage} dari ${pages} · ${events.length} aktivitas · ${activityPageSize} per halaman</span><button class="btn btn-quiet" data-member-activity-page="-1" ${activityPage<=1?'disabled':''}>Sebelumnya</button><button class="btn btn-quiet" data-member-activity-page="1" ${activityPage>=pages?'disabled':''}>Berikutnya</button></div>`}
function page(){const d=state.data;if(state.page==='dashboard')return dashboard();if(state.page==='licenses')return `${pageHead('License Saya','Semua license dan masa aktif yang diterbitkan untuk akun Anda.')}<section class="panel">${licenseCards()}</section>`;if(state.page==='accounts'){const active=d.bindings.filter(x=>x.release_state!=='released'&&x.binding_status!=='RELEASED'&&!x.released_at).length,released=d.bindings.length-active;return `${pageHead('Akun Tersinkron','Akun trading yang terikat pada license dan kuota slot Anda.')}<section class="panel">${head('▣','MT5 Accounts',`${active} akun aktif · ${released} riwayat release · gunakan flow pairing resmi dari HELIX Engine.`)}${accountTable()}<div class="notice" style="margin-top:14px">Untuk menghubungkan akun, masukkan kode OTP 8 digit dari HELIX ENGINE. Akses pairing diperiksa server berdasarkan akun member dan license canary yang diizinkan.</div></section>`}if(state.page==='activity')return `${pageHead('License Activity','Jejak aktivasi, sync, perubahan status, dan reset slot dari server.')}<section class="panel">${head('◷','Riwayat Aktivitas','Aktivitas license Anda terbaru.')}${activityRows()}</section>`;if(state.page==='announcements')return `${pageHead('Announcements','Informasi versi EA, jadwal maintenance, dan pemberitahuan dari Admin.')}<section class="panel">${head('♢','Pengumuman HELIX','Pengumuman dikelompokkan berdasarkan kategori. Buka item untuk membaca isi lengkap.')}${announcementRows(d.announcements,true)}</section>`;if(state.page==='materials')return `${pageHead('Materials','Download file, panduan instalasi, setup WebRequest, dan release notes.')}<section class="panel">${head('▤','Panduan & File','Material dikelompokkan berdasarkan kategori.')}${materialRows(d.materials,true)}</section>`;return `${pageHead('My Profile','Profil, keamanan, dan akses portal Anda.')}<section class="panel">${profileSummary()}</section>`}
function pageHead(title,sub){return `<div class="page-title"><div><div class="eyebrow">HELIX VIP MEMBER</div><h1>${title}</h1><p>${sub}</p></div></div>`}
function render(){nav();$('#content').innerHTML=page();$('#nav').querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page))}
async function load(){const{data:{session}}=await sb.auth.getSession();if(!session){location.replace('/vip/login');return}$('#user-email').textContent=session.user.email||'';$('#avatar').textContent=(session.user.email||'H')[0].toUpperCase();const{data:role,error}=await sb.rpc('helix_current_role');if(error){$('#content').innerHTML='<div class="notice">Sesi terverifikasi, tetapi data role tidak dapat dimuat.</div>';return}if(role==='admin'){location.replace('/vip/admin/');return}try{const r=await api('member');state.data=r;render()}catch(e){$('#content').innerHTML=`<div class="notice">${esc(e.message)}</div>`}}
async function reset(){const{data:{session}}=await sb.auth.getSession();const{error}=await sb.auth.resetPasswordForEmail(session.user.email,{redirectTo:new URL('/vip/login?flow=recovery',location.origin).href});if(error)throw error;toast('Link reset password dikirim oleh HELIX TEAM.')}
document.addEventListener('click',async e=>{const b=e.target.closest('button,[data-page]');if(!b)return;if(b.id==='menu')$('#sidebar').classList.toggle('open');if(b.dataset.page){state.page=b.dataset.page;render();scrollTo({top:0,behavior:'smooth'});$('#sidebar').classList.remove('open')}try{if(b.id==='logout'||b.hasAttribute('data-logout')){if(await HelixUI.confirm({title:'Akhiri sesi akun?',message:'Sesi akun pada perangkat ini akan diakhiri.',confirmText:'Keluar'})){await sb.auth.signOut();location.replace('/vip/login')}}if(b.hasAttribute('data-edit-profile-name')){const values=await HelixUI.modal({title:'Ubah nama profil',message:'Nama ini akan tampil pada profil HELIX Anda.',confirmText:'Lanjutkan',fields:[{name:'display_name',label:'Nama tampilan',type:'text',value:state.data.member.display_name||'',required:true,minLength:2,maxLength:80}]});if(values&&await HelixUI.confirm({title:'Konfirmasi perubahan nama',message:`Nama profil akan diubah menjadi ${values.display_name.trim()}.`,confirmText:'Simpan nama'})){const result=await api('member/profile',{display_name:values.display_name},'PATCH');state.data.member=result.member;render();toast('Nama profil berhasil diperbarui.')}}if(b.hasAttribute('data-reset')&&await HelixUI.confirm({title:'Kirim tautan reset password?',message:'HELIX TEAM akan mengirim email untuk membuat password baru.',confirmText:'Kirim tautan'}))await reset();if(b.dataset.download){const result=await api('member/materials/'+b.dataset.download);location.href=result.url}if(b.dataset.releaseBinding){const reason=await HelixUI.prompt({title:'Lepas akun MT5',message:state.data.release_ack_v18k?'Permintaan pelepasan akan berstatus PENDING RELEASE. Slot tetap terpakai sampai semua terminal aktif membersihkan pending order HELIX dan mengirim ACK.':'Setelah dilepas, slot license tersedia untuk akun lain.',label:'Alasan melepas akun (minimal 3 karakter)',required:true,minLength:3,maxLength:300});if(reason&&await HelixUI.confirm({title:'Konfirmasi pelepasan akun',message:state.data.release_ack_v18k?'EA akan memblokir entry baru, membersihkan pending order HELIX, lalu mengirim ACK. Slot baru dibebaskan setelah seluruh session terminal mengonfirmasi.':'Akun ini akan dilepas dari license dan sesi terminal terkait dicabut.',confirmText:'Minta lepas akun',danger:true})){const result=await api('member/bindings/'+b.dataset.releaseBinding,{action:'release',reason});state.data=await api('member');render();toast(result.state==='PENDING_RELEASE'?'Pelepasan menunggu konfirmasi semua terminal. Slot tetap terpakai.':'Binding akun sudah dilepas.')}}if(b.hasAttribute('data-change-email')){const result=await HelixUI.modal({title:'Minta ganti email',message:'Alamat portal berubah setelah email baru diverifikasi oleh HELIX TEAM.',confirmText:'Kirim permintaan',fields:[{name:'email',label:'Alamat email baru',type:'email',required:true,maxLength:254}]});if(result&&await HelixUI.confirm({title:'Konfirmasi email baru',message:`Tautan verifikasi akan dikirim ke ${result.email}. Email login belum berubah sampai tautan dibuka.`,confirmText:'Kirim verifikasi'})){const{error}=await sb.auth.updateUser({email:result.email.trim()});if(error)throw error;toast('Permintaan perubahan email dikirim untuk konfirmasi.')}}}catch(err){toast(err.message,true)}});
document.addEventListener('click',e=>{const sidebar=$('#sidebar'),menu=$('#menu');if(sidebar?.classList.contains('open')&&!sidebar.contains(e.target)&&!menu?.contains(e.target))sidebar.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#sidebar').classList.remove('open')});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.stat-link[data-page]')){e.preventDefault();state.page=e.target.dataset.page;render();scrollTo({top:0,behavior:'smooth'})}});$('#search').addEventListener('input',e=>{const term=e.target.value.toLowerCase();document.querySelectorAll('.item-row').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(term))});installHelixUi().catch(()=>{}).finally(()=>{document.documentElement.style.visibility='';load()});
</script><script>
const legacyDashboard=dashboard;function ensureR2SummaryStyles(){if(document.getElementById('r2-summary-styles'))return;const style=document.createElement('style');style.id='r2-summary-styles';style.textContent='.r2-summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:13px 0}.r2-summary-grid>.section{min-width:0;margin-top:0}.r2-summary-grid .stat{min-height:105px}@media(max-width:760px){.r2-summary-grid{grid-template-columns:1fr}}';document.head.append(style)}dashboard=function(){let html=legacyDashboard();const universal=Boolean(state.data?.universal_slots_enabled),multi=Boolean(state.data?.multi_product_enabled);if(universal){const pool=state.data.slot_pool||{used:0,total:0};html=html.replace(/<strong class="stat-value">\d+<\/strong><span class="stat-note">\d+ slot terpakai<\/span>/,`<strong class="stat-value">${pool.used}</strong><span class="stat-note">akun unik dari ${pool.total} slot member-wide</span>`)}if(universal||multi){ensureR2SummaryStyles();const cards=`${universal?memberSlotCard():''}${multi?productCatalog():''}`;html=html.replace('<div class="dashboard-grid">',`<div class="r2-summary-grid">${cards}</div><div class="dashboard-grid">`)}return html};
const legacyAccountTable=accountTable;function universalAccountPanelRows(includeReleased=true){const pool=state.data.slot_pool;if(!pool)return legacyAccountTable(includeReleased);const accounts=(pool.accounts||[]).filter(a=>includeReleased||a.status!=='released');if(!accounts.length)return empty('Belum ada akun MT5 tersinkron','Setelah pairing OTP disetujui, akun kanonis akan tampil di sini.');const v18k=state.data.release_ack_v18k;return `<div class="table-wrap"><table><thead><tr><th>Broker / Server</th><th>Login</th><th>Mode</th><th>Produk / Session</th>${v18k?'<th>Status</th>':''}<th>Aksi</th></tr></thead><tbody>${accounts.map(a=>{const bindings=a.bindings||[],products=bindings.flatMap(b=>(b.product_sessions||[]).filter(s=>!s.revoked_at).map(s=>s.ea_product_id));const first=bindings.find(b=>b.release_state!=='released'&&!b.released_at);return `<tr><td>${esc(a.broker_server)}</td><td>${esc(a.account_login)}</td><td>${esc(a.mode)}</td><td><details><summary>${[...new Set(products)].map(esc).join(', ')||'Lihat session'}</summary>${bindings.map(b=>`<div class="panel-sub">${esc(state.data.licenses.find(l=>l.id===b.license_id)?.product_slug||'HELIX')} · ${(b.product_sessions||[]).map(s=>`${esc(s.ea_product_id)} ${esc(s.ea_version||'')}${s.revoked_at?' (revoked)':''}`).join(', ')||'Session belum terdata'}</div>`).join('')}</details></td>${v18k?`<td>${esc(a.status)}${a.status==='pending_release'?'<div class="panel-sub">Menunggu release ACK semua terminal terkait</div>':''}</td>`:''}<td>${first?`<button class="btn btn-danger" data-release-binding="${first.id}">Lepas seluruh akun</button>`:'—'}</td></tr>`}).join('')}</tbody></table></div>`}
accountTable=function(includeReleased=true){return state.data?.universal_slots_enabled?universalAccountPanelRows(includeReleased):legacyAccountTable(includeReleased)};
const legacyLicenseCards=licenseCards;licenseCards=function(){const html=legacyLicenseCards();return state.data?.universal_slots_enabled?html.replace(/\d+\/\d+ slot terpakai/g,'tidak dihitung per license · berbagi pool member-wide'):html};
const legacyMemberPage=page;page=function(){let html=legacyMemberPage();if(state.data?.universal_slots_enabled&&state.page==='accounts'){const pool=state.data.slot_pool||{used:0,total:0};html=html.replace(/\d+ akun aktif · \d+ riwayat release · gunakan flow pairing resmi dari HELIX Engine\./,`${pool.used} akun MT5 unik memakai ${pool.total} slot member-wide · daftar di bawah dikelompokkan per akun canonical.`)}return html};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-change-email]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();try{const values=await HelixUI.modal({title:'Request perubahan email',message:'Admin akan mengirim invitation ke email baru. Setelah diproses, akses, license, dan koneksi pada akun lama akan dinonaktifkan; Anda akan menerima akses dan license baru. Setelah submit, hubungi Admin HELIX melalui chat.',confirmText:'Lanjutkan',fields:[{name:'old_email',label:'Email lama',type:'email',value:state.data.member.email,required:true,maxLength:254},{name:'new_email',label:'Email baru',type:'email',required:true,maxLength:254},{name:'password',label:'Password login portal VIP',type:'password',required:true,maxLength:200},{name:'note',label:'Catatan (opsional)',type:'textarea',maxLength:300}]});if(!values)return;if(!await HelixUI.confirm({title:'Konfirmasi request perubahan email',message:'Request akan dikirim untuk ditinjau Admin. Jangan gunakan update email langsung. Akses lama baru dinonaktifkan setelah proses invitation/license selesai.',confirmText:'Kirim request'}))return;await api('member/email-change-requests',values,'POST');state.data=await api('member');render();toast('Request perubahan email terkirim. Hubungi Admin HELIX melalui chat setelah submit.')}catch(error){toast(error.message,true)}},true);
document.addEventListener('click',e=>{const open=e.target.closest('[data-announcement-open]');if(open)showAnnouncement(open.dataset.announcementOpen);if(e.target.classList.contains('modal-backdrop'))$('#overlay').innerHTML='';if(e.target.closest('[data-close]'))$('#overlay').innerHTML=''});
document.addEventListener('input',e=>{const type=e.target.dataset.contentSearch;if(type)filterContent(type)});
document.addEventListener('change',e=>{const type=e.target.dataset.contentKind;if(type)filterContent(type)});
document.addEventListener('click',e=>{const button=e.target.closest('[data-member-activity-page]');if(!button)return;activityPage=Math.max(1,activityPage+Number(button.dataset.memberActivityPage));render()});
</script></body></html>
