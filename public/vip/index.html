<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HELIX VIP Member</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#080a0d;color:#f5f1e8;font:14px system-ui;padding:24px}.wrap{max-width:1120px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;padding-bottom:20px;border-bottom:1px solid #4a381d}.brand{font-size:24px;letter-spacing:4px;color:#ffe1a0;font-weight:800}.sub{color:#f2bf5c;font-size:9px;letter-spacing:2px}.top-right{display:flex;align-items:center;gap:12px}.muted{color:#a7adb2;font-size:12px}.btn{border:1px solid #e2ad4e;border-radius:8px;padding:9px 13px;background:linear-gradient(120deg,#ffe092,#bd7b1e);color:#1c1204;font-weight:800;cursor:pointer}.heading{margin:32px 0 22px}.heading h1{font-size:30px;margin:7px 0}.gold{color:#f2bf5c}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:18px}.card{background:#14191e;border:1px solid #4a381d;border-radius:14px;padding:19px}.stat strong{display:block;font-size:26px;margin-top:7px}.section{margin-top:18px}.section h2{font-size:16px;color:#ffe1a0;margin:0 0 5px}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:660px}.table th,.table td{text-align:left;padding:13px 8px;border-bottom:1px solid #2b3034;font-size:12px}.table th{color:#8f989f;font-size:10px;text-transform:uppercase}.pill{padding:4px 8px;border-radius:20px;border:1px solid #2b805d;color:#45d99d;background:#0b2d21;font-size:10px}.empty{padding:25px 0;color:#a7adb2}.notice{border:1px solid #5a451f;background:#20190f;color:#ead29b;padding:13px;border-radius:10px;font-size:12px}.error{color:#ff969b}@media(max-width:700px){body{padding:16px}.top{align-items:flex-start;gap:14px}.top-right{flex-direction:column;align-items:flex-end}.grid{grid-template-columns:1fr 1fr}.heading h1{font-size:25px}}@media(max-width:430px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="top"><div><div class="brand">HELIX</div><div class="sub">VIP MEMBER PORTAL</div></div><div class="top-right"><span class="muted" id="email">Checking session...</span><button class="btn" id="logout">Logout</button></div></header><div id="app"><p class="muted">Loading secure member data...</p></div></main><script>const c=supabase.createClient('https://wouwoefzghecuiknznvs.supabase.co','sb_publishable_FDLLBcmYFGiS9PDbyvgDtQ_UWUB8fUc'),$=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));async function load(){const{data:{session}}=await c.auth.getSession();if(!session){location.href='/vip/login';return}const{data:me}=await c.from('helix_members').select('display_name,email,role').eq('id',session.user.id).maybeSingle();if(me?.role==='admin'){location.replace('/vip/admin/');return}$('email').textContent=me?.email||session.user.email||'';const{data:licenses,error}=await c.from('helix_licenses').select('id,product_slug,license_key_hint,status,expires_at,max_accounts,created_at').eq('member_id',session.user.id).order('created_at',{ascending:false});if(error){$('app').innerHTML='<p class="error">Data license belum dapat dimuat. Coba lagi nanti.</p>';return}const ids=(licenses||[]).map(x=>x.id);let bindings=[];if(ids.length){const r=await c.from('helix_license_bindings').select('license_id,broker_server,account_login,mode,last_sync_at,released_at').in('license_id',ids).is('released_at',null);bindings=r.data||[]}const active=(licenses||[]).filter(x=>x.status==='active').length;$('app').innerHTML=`<section class="heading"><div class="gold">MEMBER WORKSPACE</div><h1>Selamat datang di <span class="gold">HELIX VIP</span></h1><p class="muted">Kelola license dan akun MT5 yang terhubung dari satu tempat.</p></section><section class="grid"><div class="card stat"><span class="muted">Total license</span><strong>${licenses?.length||0}</strong></div><div class="card stat"><span class="muted">License aktif</span><strong>${active}</strong></div><div class="card stat"><span class="muted">Akun tersinkron</span><strong>${bindings.length}</strong></div></section><section class="card section"><h2>My Licenses</h2><p class="muted">Data di bawah berasal langsung dari Supabase; tidak ada data demo.</p>${licenses?.length?`<div class="table"><table><thead><tr><th>Product</th><th>License</th><th>Status</th><th>Expiry</th><th>Max account</th></tr></thead><tbody>${licenses.map(x=>`<tr><td>${esc(x.product_slug)}</td><td>${esc(x.license_key_hint)}</td><td><span class="pill">${esc(x.status)}</span></td><td>${new Date(x.expires_at).toLocaleDateString('id-ID')}</td><td>${x.max_accounts}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada license yang diberikan oleh Admin.</div>'}</section><section class="card section"><h2>MT5 Accounts</h2><p class="muted">Binding akun aktif yang diterima License Server.</p>${bindings.length?`<div class="table"><table><thead><tr><th>Broker server</th><th>Account login</th><th>Mode</th><th>Last sync</th></tr></thead><tbody>${bindings.map(x=>`<tr><td>${esc(x.broker_server)}</td><td>${esc(x.account_login)}</td><td>${esc(x.mode)}</td><td>${new Date(x.last_sync_at).toLocaleString('id-ID')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada akun MT5 yang terhubung.</div>'}</section><div class="notice section">Aktivasi dan reset slot akan tersedia setelah License API HELIX terhubung. Saat ini halaman hanya membaca data server secara aman.</div>`}$('logout').onclick=async()=>{await c.auth.signOut();location.href='/vip/login'};load();</script></body></html>
