<div class="toast-host" id="toasts"></div>
<div id="modal-root"></div>
<script>
  // Standalone UI prototype only. No real license, database, or trading action occurs.
  const initialState = () => ({
    licenses:[
      {id:'LQ-1',name:'HELIX QUADRIGA 1.0',label:'Primary Trading License',identifier:'QDG-2026-7X9A',status:'ACTIVE',activated:'2026-10-09',expires:'2028-10-09',limit:5,accounts:[
        {server:'ICMarketsSC-Live32',login:'12840391',mode:'Real',alias:'VPS Jakarta',lastSync:'2026-10-10T08:24:00+07:00'},
        {server:'Exness-Real12',login:'74019230',mode:'Real',alias:'Trading Desktop',lastSync:'2026-10-10T10:55:00+07:00'},
        {server:'Pepperstone-Edge04',login:'39087541',mode:'Demo',alias:'MT5 Demo',lastSync:'2026-10-09T22:13:00+07:00'}
      ]},
      {id:'LQ-2',name:'HELIX QUADRIGA 1.0',label:'Secondary Trading License',identifier:'QDG-2026-9B2F',status:'SUSPENDED',activated:'2026-10-09',expires:'2028-12-07',limit:5,accounts:[
        {server:'ICMarketsSC-Live06',login:'22180061',mode:'Real',alias:'Server London',lastSync:'2026-10-09T18:11:00+07:00'}
      ]}
    ],
    events:[{type:'sync',message:'License sync berhasil',info:'ICMarketsSC-Live32 • 12840391',at:'2026-10-10T08:24:00+07:00'},
      {type:'activation',message:'Akun MT5 berhasil terhubung',info:'Exness-Real12 • 74019230',at:'2026-10-09T21:41:00+07:00'},
      {type:'license',message:'License QUADRIGA dibuat & diaktifkan',info:'QDG-2026-7X9A',at:'2026-10-09T15:17:00+07:00'}],
    page:'licenses',selected:'LQ-1',scenario:'default'
  });
  const profiles=[
    {server:'Pepperstone-Edge15',login:'90128451',mode:'Real',alias:'VPS Singapore'},
    {server:'Exness-Real21',login:'62071934',mode:'Real',alias:'MT5 Windows'},
    {server:'ICMarketsSC-Live09',login:'44012856',mode:'Real',alias:'VPS Tokyo'},
    {server:'Tickmill-Live08',login:'55309170',mode:'Real',alias:'Terminal Trading'},
    {server:'VantageInternational-Live',login:'79205748',mode:'Real',alias:'VPS Backup'},
    {server:'Eightcap-Live06',login:'81024638',mode:'Real',alias:'Trading Server'},
    {server:'ICMarketsSC-Live32',login:'12840391',mode:'Real',alias:'VPS Jakarta (akun yang sama)'}
  ];
  let state=initialState();let modal=null;
  const $=(id)=>document.getElementById(id);const icon=(name)=>`<svg><use href="#i-${name}"/></svg>`;
  const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const formatDate=(value)=>new Date(value+'T12:00:00+07:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric',timeZone:'Asia/Jakarta'});
  const formatAt=(value)=>new Date(value).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jakarta'});
  const license=()=>state.licenses.find(x=>x.id===state.selected)||state.licenses[0];
  const countActive=()=>state.licenses.filter(x=>x.status==='ACTIVE').length;
  const getSlots=(l)=>l.limit-l.accounts.length;
  const badge=(status)=>`<span class="pill ${status==='ACTIVE'?'pill-ok':status==='SUSPENDED'?'pill-warn':'pill-bad'}">${esc(status)}</span>`;
  function toast(message,error=false){const node=document.createElement('div');node.className='toast'+(error?' error':'');node.innerHTML=`${icon(error?'alert':'check')}<span>${esc(message)}</span>`;$('toasts').append(node);setTimeout(()=>node.remove(),4200)}
  function logEvent(type,message,info){state.events.unshift({type,message,info,at:new Date().toISOString()});}
  function pageHead(eyebrow,title,sub,actions=''){return `<div class="page-top"><div><div class="eyebrow">${eyebrow}</div><h1 class="h1">${title}</h1><p class="subtitle">${sub}</p></div>${actions?`<div class="top-buttons">${actions}</div>`:''}</div>`}
  function stats(){const linked=state.licenses.reduce((n,l)=>n+l.accounts.length,0),available=state.licenses.filter(l=>l.status==='ACTIVE').reduce((n,l)=>n+getSlots(l),0);return `<div class="stats-grid">
    ${stat('Total licenses',state.licenses.length,'License milik member','key')}
    ${stat('Active licenses',countActive(),'Siap digunakan','shield')}
    ${stat('Connected MT5',linked,'Akun trading terdaftar','monitor')}
    ${stat('Available slots',available,'Pada license yang aktif','plus')}
  </div>`}
  function stat(label,value,footer,i){return `<div class="stat"><div class="stat-top">${label}${icon(i)}</div><div class="stat-num">${value}</div><div class="stat-footer">${footer}</div></div>`}
  function licenseCards(){return `<div class="card card-pad"><div class="section-header"><div class="section-title">Your licenses</div><div class="section-sub">Pilih license untuk melihat detail dan akun yang terhubung</div></div><div class="licenses-list">${state.licenses.map(l=>`<button type="button" class="license-option ${l.id===state.selected?'selected':''}" data-select-license="${l.id}"><div class="row"><div class="license-name">${esc(l.name)}</div>${badge(l.status)}</div><div class="license-desc">${esc(l.label)} · ${esc(l.identifier)}</div><div class="license-footer"><span>${icon('monitor')} &nbsp; ${l.accounts.length}/${l.limit} MT5 accounts</span><span>Exp ${formatDate(l.expires)}</span></div></button>`).join('')}</div></div>`}
  function details(l){return `<div class="card card-pad detail-card"><div class="detail-head"><div><div class="small-label">License detail</div><h2 class="detail-title">${esc(l.name)}</h2><div class="detail-type">${esc(l.label)}</div></div>${badge(l.status)}</div><div class="license-id"><div><div class="small-label">License identifier · bukan key rahasia</div><code>${esc(l.identifier)}</code></div><button class="btn btn-sm" data-copy="${esc(l.identifier)}" title="Salin license ID">${icon('copy')} Copy ID</button></div>
    <div class="divider"></div><div class="detail-metrics"><div class="detail-metric"><small>Activated</small><strong>${formatDate(l.activated)}</strong></div><div class="detail-metric"><small>Valid until</small><strong>${formatDate(l.expires)}</strong></div><div class="detail-metric"><small>Account limit</small><strong>${l.limit} accounts</strong></div></div>
    <div class="divider"></div><div class="progress-txt"><span>Account slot usage</span><span style="color:var(--accent);font-weight:700">${l.accounts.length} of ${l.limit} used</span></div><div class="progress"><div style="width:${Math.min(100,l.accounts.length/l.limit*100)}%"></div></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px"><button class="btn btn-primary" data-connect="${l.id}" ${l.status!=='ACTIVE'?'disabled':''}>${icon('plus')} ${getSlots(l)===0?'Reconnect existing MT5':'Connect MT5 account'}</button><button class="btn" data-page="accounts">${icon('monitor')} Manage accounts ${icon('arrow')}</button></div>
    ${l.status!=='ACTIVE'?`<div class="callout">${icon('alert')} License ${l.status.toLowerCase()}; aktivasi baru tidak tersedia. Hubungi admin untuk mengubah status.</div>`:''}
    ${getSlots(l)===0?`<div class="callout">Semua ${l.limit} slot terpakai. Pairing ulang akun existing tetap bisa; untuk menambah akun berbeda, deactivate salah satu akun terlebih dahulu.</div>`:''}
    </div>`}
  function helpCard(){return `<div class="help-card"><div style="display:flex;align-items:center;gap:9px;color:#c9fff0">${icon('link')} <strong>Connect MT5 in 3 steps</strong></div>
    <div class="step-row"><span class="num">1</span><div><strong>Jalankan HELIX di MT5</strong><p>EA menampilkan kode pairing sementara di ENGINE dashboard.</p></div></div>
    <div class="step-row"><span class="num">2</span><div><strong>Masukkan pairing code</strong><p>Pilih license, masukkan kode dari EA, lalu verifikasi identitas akun.</p></div></div>
    <div class="step-row"><span class="num">3</span><div><strong>Aktivasi otomatis</strong><p>Server mengikat akun ke license. EA menerima entitlement yang valid.</p></div></div>
    <button class="btn btn-primary" style="width:100%;margin-top:20px" data-connect="${state.selected}">${icon('plus')} Connect MT5 account</button>
  </div><div class="note-card">${icon('info')} <strong>Demo only.</strong> Pairing, verifikasi, dan sync dalam mockup ini disimulasikan di browser. Tidak terhubung ke MT5, Supabase, atau server sungguhan.</div>`}
  function compactAccounts(l){return `<div class="card card-pad" style="margin-top:20px"><div class="row section-header"><div><div class="section-title">Connected MT5 accounts</div><div class="section-sub">Satu broker server + login dihitung sebagai satu slot</div></div><button class="btn btn-sm btn-ghost" data-page="accounts">View all ${icon('arrow')}</button></div>${accountTable(l)}</div>`}
  function accountTable(l){const slots=[...l.accounts,...Array.from({length:getSlots(l)},()=>null)];return `<div class="table-wrap"><table class="slottable"><thead><tr><th>Slot / account</th><th>Last sync</th><th>Status</th><th style="text-align:right">Action</th></tr></thead><tbody>${slots.map((a,i)=>`<tr><td><div class="label-main">${a?esc(a.alias):`Slot ${i+1}`}</div><div class="label-sub">${a?`${esc(a.server)} · ${esc(a.login)}`:'Available for a new MT5 account'}</div></td><td>${a?formatAt(a.lastSync):'<span class="slot-empty">—</span>'}</td><td>${a?(l.status==='ACTIVE'?badge('ACTIVE'):badge(l.status)):'<span class="slot-empty">Available</span>'}</td><td class="td-action">${a?`<button class="action-link danger-link" data-deactivate="${l.id}" data-login="${esc(a.login)}" data-server="${esc(a.server)}">Deactivate</button>`:`<button class="action-link" data-connect="${l.id}" ${l.status!=='ACTIVE'?'disabled':''}>Connect ${icon('arrow')}</button>`}</td></tr>`).join('')}</tbody></table></div>`}
  function licensesPage(){const l=license();return pageHead('License management','My Licenses','Kelola entitlement, masa aktif, serta aktivasi akun MT5 langsung dari VIP Portal.',`<button class="btn" data-page="activity">${icon('activity')} Activation history</button><button class="btn btn-primary" data-connect="${l.id}" ${l.status!=='ACTIVE'?'disabled':''}>${icon('plus')} Connect MT5 account</button>`)+stats()+`<div class="workspace-grid"><div><div class="workspace-grid" style="grid-template-columns:minmax(250px,.8fr) minmax(320px,1.3fr);gap:16px">${licenseCards()}${details(l)}</div>${compactAccounts(l)}</div><div>${helpCard()}</div></div>${footer()}`}
  function accountsPage(){return pageHead('Account bindings','MT5 Accounts','Lihat broker, nomor login, dan status akun di setiap license. Deactivate jika ingin mengganti akun.',`<button class="btn btn-primary" data-connect="${state.selected}">${icon('plus')} Connect MT5 account</button>`)+`<div class="subbanner"><div><strong>One trading account = one license slot</strong><p>Terminal/VPS lain dengan broker server dan account login yang sama tidak menambah slot.</p></div><button class="btn btn-sm" data-page="licenses">Manage licenses ${icon('arrow')}</button></div>`+state.licenses.map(l=>`<div class="card card-pad" style="margin-top:15px"><div class="row section-header"><div><div class="section-title">${esc(l.name)} <span style="font-weight:400;color:#93a7b7">/ ${esc(l.identifier)}</span></div><div class="section-sub">${l.accounts.length}/${l.limit} occupied slots · ${esc(l.label)}</div></div>${badge(l.status)}</div>${accountTable(l)}</div>`).join('')+footer()}
  function activityPage(){return pageHead('Audit trail','License Activity','Riwayat aktivasi, reset slot, pairing dan sinkronisasi pada akun VIP kamu.',`<button class="btn" data-sync>${icon('refresh')} Simulate successful sync</button>`)+`<div class="card card-pad"><div class="section-title">Recent activity</div><div class="section-sub">Data contoh di prototype; peristiwa baru akan muncul setelah kamu melakukan simulasi.</div><div style="margin-top:20px">${state.events.map(ev=>`<div class="activity-item"><div class="activity-dot">${icon(ev.type==='deactivate'?'log-out':ev.type==='sync'?'refresh':ev.type==='license'?'shield':'check')}</div><div><div class="activity-desc">${esc(ev.message)}</div><div class="activity-meta">${esc(ev.info)} · ${formatAt(ev.at)}</div></div></div>`).join('')}</div></div>`+footer()}
  function dashboardPage(){return pageHead('Member workspace','Welcome to HELIX VIP','Pantau informasi license dan akun trading dari satu tempat.',`<button class="btn btn-primary" data-page="licenses">Open My Licenses ${icon('arrow')}</button>`)+stats()+`<div class="workspace-grid"><div>${licenseCards()}</div><div>${helpCard()}</div></div>`+footer()}
  function announcementsPage(){return pageHead('HELIX updates','Announcements','Informasi rilis dan perubahan layanan HELIX untuk member VIP.')+`<div class="card card-pad"><div class="activity-item" style="border-top:0"><div class="activity-dot">${icon('bell')}</div><div><div class="activity-desc">Welcome to HELIX VIP Portal</div><div class="activity-meta">Contoh pengumuman. Admin dapat menampilkan informasi rilis di sini.</div></div></div><div class="activity-item"><div class="activity-dot">${icon('shield')}</div><div><div class="activity-desc">License self-service activation</div><div class="activity-meta">Member dapat memantau 5 slot akun dalam satu license.</div></div></div></div>`+footer()}
  function materialsPage(){return pageHead('Resources','Materials','Panduan instalasi HELIX, koneksi MT5, dan dokumentasi member.')+`<div class="card card-pad"><div class="section-title">Guides & onboarding</div><div class="section-sub">Konten contoh. File EA sungguhan hanya didistribusikan ketika sudah disiapkan admin.</div><div class="activity-item"><div class="activity-dot">${icon('book')}</div><div><div class="activity-desc">Cara menghubungkan MT5 ke VIP Portal</div><div class="activity-meta">Instal EA → izinkan WebRequest → buka pairing code → sambungkan lewat portal.</div><button class="btn btn-sm" style="margin-top:10px" data-guide>Read setup guide ${icon('arrow')}</button></div></div><div class="activity-item"><div class="activity-dot">${icon('download')}</div><div><div class="activity-desc">HELIX QUADRIGA 1.0 LIVE (EX5)</div><div class="activity-meta">Demo: file produk belum tersedia pada mockup.</div><button class="btn btn-sm" style="margin-top:10px" data-unavailable>Download EX5 ${icon('download')}</button></div></div></div>`+footer()}
  function profilePage(){return pageHead('Account settings','My Profile','Kelola profil dan permintaan keamanan akun VIP.')+`<div class="card card-pad"><div class="profile-grid"><div class="profile-row"><span class="small-label">Member name</span><strong>Demo VIP Member</strong></div><div class="profile-row"><span class="small-label">Email</span><strong>member.demo@example.com</strong></div><div class="profile-row"><span class="small-label">Password</span><strong>••••••••••••</strong><button class="btn btn-sm" data-profile="password">Request password reset</button></div><div class="profile-row"><span class="small-label">Email change</span><strong>Requires admin approval</strong><button class="btn btn-sm" data-profile="email">Request email change</button></div></div></div>`+footer()}
  function footer(){return `<div class="footer">HELIX VIP MEMBER PORTAL · Interactive frontend mockup · Semua license dan akun hanya data contoh</div>`}
  function render(){const pages={licenses:licensesPage,accounts:accountsPage,activity:activityPage,dashboard:dashboardPage,announcements:announcementsPage,materials:materialsPage,profile:profilePage};$('content').innerHTML=(pages[state.page]||licensesPage)();const names={licenses:'My Licenses',accounts:'MT5 Accounts',activity:'License Activity',dashboard:'Dashboard',announcements:'Announcements',materials:'Materials',profile:'My Profile'};$('breadcrumb').textContent=names[state.page];document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.page===state.page))}
  function navigate(page){state.page=page;render();window.scrollTo({top:0,behavior:'smooth'});$('sidebar').classList.remove('open')}
  function openConnect(id){if(id)state.selected=id;const l=license();if(l.status!=='ACTIVE'){toast('License belum aktif; pairing baru ditolak.',true);return}modal={kind:'connect',step:1,licenseId:l.id,profileIndex:0,code:String(Math.floor(100000+Math.random()*900000)),expires:Date.now()+10*60*1000};renderModal()}
  function renderModal(){const root=$('modal-root');if(!modal){root.innerHTML='';return}document.body.style.overflow='hidden';if(modal.kind==='deactivate'){const l=state.licenses.find(x=>x.id===modal.licenseId),a=l.accounts.find(x=>x.login===modal.login&&x.server===modal.server);if(!a){closeModal();return}root.innerHTML=`<div class="modal-backdrop" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-label="Deactivate MT5 account" style="max-width:540px"><div class="modal-top"><div><div class="eyebrow">Account management</div><h2 class="modal-headline">Deactivate MT5 account?</h2><div class="modal-subtitle">Akun ini akan dilepas dari license yang dipilih.</div></div><button class="icon-btn" data-modal-close aria-label="Tutup">${icon('x')}</button></div><div class="modal-scroll"><div class="review"><div class="review-item"><div class="small-label">Broker server</div><strong>${esc(a.server)}</strong></div><div class="review-item"><div class="small-label">Account login</div><strong>${esc(a.login)}</strong></div></div><div class="callout" style="margin-top:18px">Pada sistem produksi, perubahan binding berlaku saat EA menerima status server. Posisi terbuka harus tetap ditangani dengan aman, tanpa entry baru setelah penolakan terkonfirmasi.</div></div><div class="modal-bottom"><button class="btn" data-modal-close>Cancel</button><button class="btn btn-danger" data-confirm-deactivate="true">${icon('log-out')} Deactivate account</button></div></section></div>`;return}
    const l=state.licenses.find(x=>x.id===modal.licenseId),p=profiles[modal.profileIndex],m=modal;
    const steps=`<div class="steps"><div class="step-chip ${m.step===1?'current':'done'}"><span class="step-circle">${m.step>1?icon('check'):'1'}</span> Pairing</div><div class="step-connector"></div><div class="step-chip ${m.step===2?'current':m.step>2?'done':''}"><span class="step-circle">${m.step>2?icon('check'):'2'}</span> Review account</div><div class="step-connector"></div><div class="step-chip ${m.step===3?'current':''}"><span class="step-circle">3</span> Connected</div></div>`;
    let body='',bottom='';
    if(m.step===1){body=`<div class="pairing-grid"><div class="mt5-preview"><div class="mt5-bar"><div class="mt5-engine">HELIX ENGINE <span style="color:#70a89e;font-size:9px;letter-spacing:0;font-weight:600">— Simulated MT5</span></div><span class="pill pill-warn">PAIRING</span></div><div class="code-wrap"><div class="small-label">One-time pairing code</div><div class="code-preview">${m.code.slice(0,3)}-${m.code.slice(3)}</div><div class="code-caption">Berlaku 10 menit · hanya untuk demonstrasi</div></div><div class="preview-fields"><div><span>Broker server</span><strong>${esc(p.server)}</strong></div><div><span>MT5 account</span><strong>${esc(p.login)}</strong></div><div><span>Account type</span><strong>${esc(p.mode)}</strong></div></div><div class="info-box">${icon('info')} Dalam produk sebenarnya kode ini muncul pada EA di terminal MT5, bukan di portal.</div></div>
       <div class="form-block"><div class="section-title">Enter pairing code</div><p>Masukkan 6 digit yang ditampilkan oleh HELIX ENGINE. Untuk menguji mockup, kamu bisa mengganti terminal simulasi berikut.</p><label class="field-label" for="profile-select">Simulated MT5 terminal (demo only)</label><select class="input" id="profile-select">${profiles.map((x,i)=>`<option value="${i}" ${i===m.profileIndex?'selected':''}>${esc(x.server)} · ${esc(x.login)}</option>`).join('')}</select><label class="field-label" for="pairing-input" style="margin-top:21px">Pairing code</label><input class="input code-entry" id="pairing-input" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000-000" value="${esc(m.entered||'')}"><div class="field-error" id="pairing-error"></div><button class="btn btn-sm btn-ghost" data-fill-code="true" style="margin-top:6px">${icon('copy')} Gunakan kode demo</button><div class="info-box">Pairing diverifikasi server dalam desain final. Simulasi ini hanya memeriksa kode dan account binding di browser.</div></div></div>`;
      bottom=`<span class="muted-small">License: ${esc(l.identifier)} · Slot ${l.accounts.length}/${l.limit}</span><div style="display:flex;gap:9px"><button class="btn" data-modal-close>Cancel</button><button class="btn btn-primary" id="validate-code">Validate pairing ${icon('arrow')}</button></div>`;
    }else if(m.step===2){const existing=l.accounts.find(a=>a.server===p.server&&a.login===p.login),full=getSlots(l)<=0;body=`<div class="section-title" style="margin-bottom:14px">Confirm detected MT5 account</div><div class="review"><div class="review-item"><span class="small-label">Product</span><strong>HELIX QUADRIGA 1.0 LIVE</strong></div><div class="review-item"><span class="small-label">License</span><strong>${esc(l.identifier)}</strong></div><div class="review-item"><span class="small-label">Broker server</span><strong>${esc(p.server)}</strong></div><div class="review-item"><span class="small-label">Account login</span><strong>${esc(p.login)} (${esc(p.mode)})</strong></div></div><div class="info-box">${icon('shield')} Account fingerprint dihitung dari broker server dan account login. Jika akun sudah terdaftar, pairing ulang tidak menghabiskan slot tambahan.</div>${existing?`<div class="callout" style="background:#17392f;border-color:#467d69;color:#b1f2db">Akun ini sudah terhubung pada license tersebut. Konfirmasi pairing akan memperbarui last sync tanpa menggunakan slot baru.</div>`:''}${full&&!existing?`<div class="callout">License sudah mencapai maksimum ${l.limit} akun. Aktivasi baru tidak dapat dilanjutkan.</div>`:''}`;
      bottom=`<span class="muted-small">Occupied slots: ${l.accounts.length}/${l.limit}</span><div style="display:flex;gap:9px"><button class="btn" data-back-pair>Back</button><button class="btn btn-primary" data-confirm-connection ${full&&!existing?'disabled':''}>${icon('check')} Confirm & activate</button></div>`;
    }else{body=`<div class="success-box"><div class="success-icon">${icon('check')}</div><h2>MT5 account connected</h2><p>Simulasi berhasil: <strong>${esc(p.server)} · ${esc(p.login)}</strong> terhubung ke license <strong>${esc(l.identifier)}</strong>. Pada implementasi nyata EA menerima entitlement bertanda tangan dari License API.</p><div class="info-box" style="max-width:440px;margin:22px auto 0">${icon('shield')} Slot sekarang ${l.accounts.length}/${l.limit} · ENGINE status: LICENSE OK (simulasi)</div></div>`;
      bottom=`<span class="muted-small">No real MT5 or backend action was performed</span><button class="btn btn-primary" data-finish-connection>View connected accounts ${icon('arrow')}</button>`;}
    root.innerHTML=`<div class="modal-backdrop" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-label="Connect MT5 Account"><div class="modal-top"><div><div class="eyebrow">Self-service activation</div><h2 class="modal-headline">Connect MT5 Account</h2><div class="modal-subtitle">Aktivasi melalui pairing code, tanpa memasukkan license key pada parameter EA.</div></div><button class="icon-btn" data-modal-close aria-label="Tutup">${icon('x')}</button></div><div class="modal-scroll">${steps}${body}</div><div class="modal-bottom">${bottom}</div></section></div>`;
  }
  function closeModal(){modal=null;$('modal-root').innerHTML='';document.body.style.overflow=''}
  function validateCode(){const inp=$('pairing-input'),err=$('pairing-error');if(!inp)return;let value=inp.value.replace(/\D/g,'');modal.entered=inp.value;if(Date.now()>modal.expires){err.textContent='Pairing code kedaluwarsa. Tutup dan buka kembali untuk membuat kode baru.';return}if(value!==modal.code){err.textContent='Kode pairing tidak cocok. Gunakan 6 digit dari simulasi ENGINE.';return}const l=state.licenses.find(x=>x.id===modal.licenseId),p=profiles[modal.profileIndex];if(l.status!=='ACTIVE'){err.textContent='License tidak aktif.';return}if(getSlots(l)===0&&!l.accounts.some(a=>a.login===p.login&&a.server===p.server)){err.textContent='Account limit reached (5/5).';return}modal.step=2;renderModal()}
  function confirmConnection(){const m=modal,l=state.licenses.find(x=>x.id===m.licenseId),p=profiles[m.profileIndex];if(!l||l.status!=='ACTIVE')return toast('License tidak aktif.',true);let account=l.accounts.find(a=>a.server===p.server&&a.login===p.login);if(!account&&getSlots(l)<=0)return toast('Maksimum slot terpakai.',true);if(!account){account={...p,lastSync:new Date().toISOString()};l.accounts.push(account);logEvent('activation','MT5 pairing berhasil',`${p.server} • ${p.login} · ${l.identifier}`)}else{account.lastSync=new Date().toISOString();logEvent('sync','Akun existing terverifikasi ulang',`${p.server} • ${p.login} · tidak menambah slot`)}m.step=3;render();renderModal()}
  function openDeactivate(id,server,login){modal={kind:'deactivate',licenseId:id,server,login};renderModal()}
  function doDeactivate(){const l=state.licenses.find(x=>x.id===modal.licenseId);const found=l.accounts.find(x=>x.login===modal.login&&x.server===modal.server);if(!found)return;const info=`${found.server} • ${found.login} · ${l.identifier}`;l.accounts=l.accounts.filter(x=>x!==found);logEvent('deactivate','Akun MT5 dilepas dari license',info);closeModal();render();toast('Akun berhasil dilepas (simulasi). Satu slot tersedia lagi.')}
  function handleGuide(){const text='SETUP HELIX MT5 (CONCEPT)\n\n1. Login VIP Portal dan cek My Licenses.\n2. Jalankan EX5 pada terminal MT5 normal.\n3. Tambahkan domain License API ke MT5 > Tools > Options > Expert Advisors > Allow WebRequest for listed URL.\n4. Buka kode pairing di HELIX ENGINE.\n5. Klik Connect MT5 Account di VIP Portal, lalu masukkan kode.\n6. Verifikasi broker/server dan login akun MT5.\n7. EA menerima entitlement, kemudian LICENSE OK.\n\nCatatan: tautan API dan komponen EA/backend belum diimplementasikan dalam mockup.';const blob=new Blob([text],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='HELIX_MT5_SETUP_GUIDE_DEMO.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
  document.addEventListener('click',async(e)=>{
    const target=e.target.closest('button');if(!target)return;
    if(target.id==='toggle-menu'){$('sidebar').classList.toggle('open');return}
    if(target.dataset.modalClose!==undefined){closeModal();return}
    if(target.dataset.page){navigate(target.dataset.page);return}
    if(target.dataset.selectLicense){state.selected=target.dataset.selectLicense;render();return}
    if(target.dataset.connect){openConnect(target.dataset.connect);return}
    if(target.dataset.copy){try{await navigator.clipboard.writeText(target.dataset.copy);toast('License ID berhasil disalin.')}catch{toast('Salin manual: '+target.dataset.copy)}return}
    if(target.dataset.fillCode){const inp=$('pairing-input');if(inp){inp.value=modal.code.slice(0,3)+'-'+modal.code.slice(3);modal.entered=inp.value;$('pairing-error').textContent=''}return}
    if(target.id==='validate-code'){validateCode();return}
    if(target.dataset.backPair!==undefined){modal.step=1;renderModal();return}
    if(target.dataset.confirmConnection!==undefined){confirmConnection();return}
    if(target.dataset.finishConnection!==undefined){closeModal();navigate('accounts');return}
    if(target.dataset.deactivate){openDeactivate(target.dataset.deactivate,target.dataset.server,target.dataset.login);return}
    if(target.dataset.confirmDeactivate!==undefined){doDeactivate();return}
    if(target.dataset.sync!==undefined){logEvent('sync','Simulasi license sync berhasil',`License ${license().identifier} · bukan koneksi sungguhan`);render();toast('Demo sync event ditambahkan.');return}
    if(target.dataset.guide!==undefined){handleGuide();return}
    if(target.dataset.unavailable!==undefined){toast('Demo only: file EX5 belum tersedia.',true);return}
    if(target.dataset.profile!==undefined){toast(target.dataset.profile==='email'?'Demo only: request email change memerlukan persetujuan admin.':'Demo only: email reset password tidak benar-benar dikirim.');return}
  });
  document.addEventListener('change',e=>{if(e.target.id==='profile-select'&&modal?.kind==='connect'&&modal.step===1){modal.profileIndex=Number(e.target.value);modal.entered='';renderModal()}});
  document.addEventListener('input',e=>{if(e.target.id==='pairing-input'){const raw=e.target.value.replace(/\D/g,'').slice(0,6);e.target.value=raw.length>3?raw.slice(0,3)+'-'+raw.slice(3):raw;modal.entered=e.target.value;$('pairing-error').textContent=''}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal();if(e.key==='Enter'&&e.target.id==='pairing-input')validateCode()});
  document.addEventListener('click',e=>{if(e.target.classList?.contains('modal-backdrop'))closeModal()});
  render();
</script>
</body>
</html>
