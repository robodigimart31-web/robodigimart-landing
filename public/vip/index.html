<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a0b"><link rel="icon" type="image/svg+xml" href="/vip/favicon.svg"><title>HELIX VIP Member Portal</title><link rel="stylesheet" href="/vip/portal.css?v=member-canary-20261012"><link rel="stylesheet" href="/vip/helix-ui/css/tokens.css"><link rel="stylesheet" href="/vip/helix-ui/css/components.css"><link rel="stylesheet" href="/vip/helix-ui/css/portal-adapter.css"><script defer src="/vip/helix-ui/js/helix-ui.js?v=role-confirm-20261012-idle30b"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="/vip/helix-ui/js/portal-r1-loader.js?v=role-confirm-20261012-idle30b"></script></head><body>
<div class="shell"><aside class="sidebar" id="sidebar"><div class="brand"><img src="/vip/helix-ui/brand/helix-emblem.webp" alt=""><div class="brand-name">HELIX<span class="brand-sub">TRADING EXPERT ADVISOR</span></div></div><div class="nav-label">Member workspace</div><nav class="nav" id="nav"></nav><div class="sidebar-foot">TRADE SMARTER<br>WITH DISCIPLINE<small>HELIX VIP · Member Portal</small></div></aside><main class="main"><header class="topbar"><button class="mobile-menu" id="menu" aria-label="Buka menu"><img class="hx-icon" src="/vip/helix-ui/icons/menu.svg" alt=""></button><label class="searchbox"><span><img class="hx-icon" src="/vip/helix-ui/icons/search.svg" alt=""></span><input id="search" placeholder="Cari license, pengumuman, atau material…"></label><div class="userbar"><div><div class="user-email" id="user-email">Memeriksa sesi…</div><span class="role-pill"><img src="/vip/helix-ui/icons/crown.svg" alt=""> VIP Member</span></div><span class="avatar" id="avatar">H</span><button class="btn btn-primary" id="logout">Logout</button></div></header><div class="content" id="content"><div class="empty">Memuat data akun dengan aman…</div></div></main></div><div id="overlay"></div><div id="toast-host"></div>
<script>
document.documentElement.style.visibility='hidden';function installHelixUi(){return new Promise((resolve,reject)=>{const paths=['/vip/helix-ui/css/tokens.css','/vip/helix-ui/css/components.css','/vip/helix-ui/css/portal-adapter.css'];let left=paths.length;for(const href of paths){const link=document.createElement('link');link.rel='stylesheet';link.href=href;link.onload=()=>{if(--left===0)resolve()};link.onerror=()=>reject(new Error('HELIX UI assets could not be loaded'));document.head.append(link)}const helper=document.createElement('script');helper.src='/vip/helix-ui/js/helix-ui.js?v=role-confirm-20261012-idle30b';helper.defer=true;document.head.append(helper)})}
const sb=supabase.createClient('https://wouwoefzghecuiknznvs.supabase.co','sb_publishable_FDLLBcmYFGiS9PDbyvgDtQ_UWUB8fUc'),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),safeUrl=s=>{try{const u=new URL(s);return u.protocol==='https:'?u.href:''}catch{return ''}},fmt=d=>d?new Date(d).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}):'—';
const menus=[['dashboard','Dashboard','home'],['licenses','My Licenses','key'],['accounts','MT5 Accounts','monitor'],['activity','License Activity','activity'],['announcements','Announcements','megaphone'],['materials','Materials','book'],['profile','My Profile','user']];let state={page:'dashboard',data:null,performance:null};
function toast(text,error=false){const n=document.createElement('div');n.className='toast'+(error?' error':'');n.textContent=text;document.body.append(n);setTimeout(()=>n.remove(),4500)}
async function api(path,body,method){const{data:{session}}=await sb.auth.getSession();const r=await fetch('/vip/api/'+path,{method:method||(body?'POST':'GET'),headers:{authorization:'Bearer '+session.access_token,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.message||d.error||'Permintaan gagal');return d}
function nav(){ $('#nav').innerHTML=menus.map(([id,label,ico])=>`<button data-page="${id}" class="${id===state.page?'active':''}"><img class="hx-icon" src="/vip/helix-ui/icons/${ico}.svg" alt="">${label}</button>`).join('') }
const hero=(title,sub,tag='MEMBER WORKSPACE')=>`<section class="hero"><div class="hero-copy"><div class="eyebrow">${tag}</div><h1>${title}</h1><p>${sub}</p></div></section>`;
const head=(icon,title,sub,action='')=>{const icons={ 'License Saya':'key','Akun Tersinkron':'monitor','MT5 Accounts':'monitor','Riwayat Aktivitas':'activity','Announcement Terbaru':'megaphone','Pengumuman HELIX':'megaphone','Material & Tutorial':'book','Panduan & File':'book','Profil Saya':'user','Aktivasi HELIX':'shield','Trading Performance':'chart' };return `<div class="panel-head"><div><h2 class="panel-title"><img class="hx-icon" src="/vip/helix-ui/icons/${icons[title]||'info'}.svg" alt="">${title}</h2>${sub?`<div class="panel-sub">${sub}</div>`:''}</div>${action}</div>`};
const empty=(title,copy)=>`<div class="empty"><strong>${title}</strong>${copy}</div>`;
const badge=s=>`<span class="status ${['suspended','revoked','expired'].includes(String(s).toLowerCase())?'bad':String(s).toLowerCase()==='pending'?'warn':''}">${esc(s||'—')}</span>`;
function licenseCards(){const {licenses,bindings}=state.data;if(!licenses.length)return `<section class="panel">${head('⚿','License Saya','License aktif Anda tampil di sini setelah Admin menerbitkannya.')}${empty('Belum ada license','Hubungi Admin HELIX untuk mendapatkan license.')}</section>`;return `<section class="panel">${head('⚿','License Saya','License dan entitlement member yang tercatat di server.')}${licenses.map(l=>{const used=bindings.filter(b=>b.license_id===l.id).length;return `<article class="item-row"><span class="item-icon">⚿</span><div><div class="item-title">HELIX ${esc(l.product_slug).toUpperCase()}</div><div class="item-copy">${esc(l.license_key_hint)} · ${used}/${l.max_accounts} slot terpakai</div><div class="item-meta">Berakhir ${fmt(l.expires_at)}</div></div>${badge(l.effective_status||l.status)}</article>`}).join('')}</section>`}
function accountTable(){const b=state.data.bindings, licenses=state.data.licenses;if(!b.length)return empty('Belum ada akun MT5 tersinkron','Setelah flow pairing HELIX Engine tersedia, akun yang tervalidasi server muncul di sini.');return `<div class="table-wrap"><table><thead><tr><th>Broker / Server</th><th>Login</th><th>License</th><th>Mode</th><th>Last Sync</th><th>Aksi</th></tr></thead><tbody>${b.map(x=>`<tr><td>${esc(x.broker_server)}</td><td>${esc(x.account_login)}</td><td>${esc(licenses.find(l=>l.id===x.license_id)?.product_slug||'HELIX')}</td><td>${esc(x.mode)}</td><td>${fmt(x.last_sync_at)}</td><td><button class="btn btn-danger" data-release-binding="${x.id}">Lepas</button></td></tr>`).join('')}</tbody></table></div>`}
function dashboard(){const d=state.data,m=d.member,active=d.licenses.filter(l=>l.status==='active'&&new Date(l.expires_at)>new Date()).length;return `${hero(`Selamat datang, <span class="gold">${esc(m.display_name||m.email.split('@')[0])}</span>`,'Kelola license, akun tersinkron, dan akses seluruh materi HELIX dalam satu tempat.')}<section class="stats"><article class="stat"><span class="stat-label">Status Akun</span><strong class="stat-value">VIP Member</strong><span class="stat-note">Akun terverifikasi</span></article><article class="stat stat-link" role="link" tabindex="0" aria-label="Buka My Licenses" data-page="licenses"><span class="stat-label">Total License Saya</span><strong class="stat-value">${d.licenses.length}</strong><span class="stat-note">${active} aktif · ${d.licenses.length-active} lainnya</span></article><article class="stat"><span class="stat-label">Next Sync</span><strong class="stat-value">—</strong><span class="stat-note">Sinkronisasi dari HELIX Engine</span></article><article class="stat stat-link" role="link" tabindex="0" aria-label="Buka MT5 Accounts" data-page="accounts"><span class="stat-label">Akun Tersinkron</span><strong class="stat-value">${d.bindings.length}</strong><span class="stat-note">${d.bindings.length} slot aktif</span></article></section><div class="dashboard-grid">${licenseCards()}<section class="panel">${head('▣','Akun Tersinkron','Akun MT5 yang sudah dikonfirmasi oleh server.')}${accountTable()}</section></div><div class="content-grid"><section class="panel">${head('♢','Announcement Terbaru','Pengumuman resmi dari Admin HELIX.')} ${announcementRows(d.announcements.slice(0,3))}<button class="btn" data-page="announcements">Lihat semua →</button></section><section class="panel">${head('▤','Material & Tutorial','Panduan resmi untuk instalasi dan penggunaan HELIX.')} ${materialRows(d.materials.slice(0,3))}<button class="btn" data-page="materials">Lihat semua →</button></section></div><section class="panel" style="margin-top:13px">${profileSummary()}</section>`}
function announcementRows(rows){return rows.length?`<div class="item-list">${rows.map(a=>`<article class="item-row"><span class="item-icon">♢</span><div><div class="item-title">${esc(a.title)}</div><div class="item-copy">${esc(a.body)}</div><div class="item-meta">${esc(a.kind)} · ${fmt(a.published_at||a.created_at)}</div></div></article>`).join('')}</div>`:empty('Belum ada pengumuman','Pengumuman baru akan tampil di sini.')}
function materialRows(rows){return rows.length?`<div class="item-list">${rows.map(a=>{const url=safeUrl(a.storage_path),privateFile=a.storage_path?.startsWith('helix-vip-materials:');return `<article class="item-row"><span class="item-icon">▤</span><div><div class="item-title">${esc(a.title)}</div><div class="item-copy">${esc(a.description)}</div><div class="item-meta">${esc(a.kind)}</div></div>${privateFile?`<button class="btn btn-quiet" data-download="${esc(a.id)}">Download ↓</button>`:url?`<a class="btn btn-quiet" href="${esc(url)}" target="_blank" rel="noopener">Buka ↗</a>`:''}</article>`}).join('')}</div>`:empty('Belum ada material','Admin akan membagikan panduan dan file di halaman ini.')}
function profileSummary(){const m=state.data.member;const name=m.display_name||'HELIX Member';return `${head('♙','Profil Saya','Informasi dan pengaturan keamanan akun.') }<div class="profile-grid"><div class="profile-col"><div class="profile-identity"><div class="avatar" style="width:60px;height:60px;font-size:25px">${esc(name[0].toUpperCase())}</div><div class="profile-identity-copy"><div class="profile-name">${esc(name)}</div><button class="btn btn-quiet" type="button" data-edit-profile-name style="margin:7px 0">Ubah nama</button><div class="panel-sub">${esc(m.email)}</div><span class="role-pill" style="display:inline-flex;margin-top:9px"><img src="/vip/helix-ui/icons/crown.svg" alt=""> VIP Member</span></div></div></div><div class="profile-col"><div class="setting"><span>Status akun</span><strong>Member terdaftar</strong></div><div class="setting"><span>Akses</span><strong>VIP Member</strong></div></div><div class="profile-col"><button class="btn btn-quiet" data-reset style="width:100%;margin:5px 0">Kirim link reset password</button><button class="btn btn-quiet" data-change-email style="width:100%;margin:5px 0">Minta ganti email</button><button class="btn btn-quiet" data-logout style="width:100%;margin:5px 0">KELUAR</button></div></div>`}
function page(){const d=state.data;if(state.page==='dashboard')return dashboard();if(state.page==='licenses')return `${pageHead('License Saya','Semua license dan masa aktif yang diterbitkan untuk akun Anda.')}<section class="panel">${licenseCards()}</section>`;if(state.page==='accounts')return `${pageHead('Akun Tersinkron','Akun trading yang terikat pada license dan kuota slot Anda.')}<section class="panel">${head('▣','MT5 Accounts',`${d.bindings.length} akun aktif · gunakan flow pairing resmi dari HELIX Engine.`)}${accountTable()}<div class="notice" style="margin-top:14px">Koneksi pairing baru muncul setelah EA/License API aktif. Portal tidak membuat kode pairing simulasi atau mengaktifkan akun tanpa validasi terminal.</div></section>`;if(state.page==='activity')return `${pageHead('License Activity','Jejak aktivasi, sync, perubahan status, dan reset slot dari server.')}<section class="panel">${head('◷','Riwayat Aktivitas','Aktivitas license Anda terbaru.')}${d.events.length?d.events.map(e=>`<article class="item-row"><span class="item-icon">◷</span><div><div class="item-title">${esc(e.event_type)}</div><div class="item-copy">${esc(JSON.stringify(e.metadata||{}))}</div><div class="item-meta">${fmt(e.created_at)}</div></div></article>`).join(''):empty('Belum ada aktivitas','Event license akan dicatat setelah terjadi aktivasi atau sinkronisasi.')}</section>`;if(state.page==='announcements')return `${pageHead('Announcements','Informasi versi EA, jadwal maintenance, dan pemberitahuan dari Admin.')}<section class="panel">${head('♢','Pengumuman HELIX','Hanya pengumuman yang dipublikasikan admin tampil di sini.')}${announcementRows(d.announcements)}</section>`;if(state.page==='materials')return `${pageHead('Materials','Download file, panduan instalasi, setup WebRequest, dan release notes.')}<section class="panel">${head('▤','Panduan & File','Materi yang sudah diterbitkan Admin HELIX.')}${materialRows(d.materials)}</section>`;return `${pageHead('My Profile','Profil, keamanan, dan akses portal Anda.')}<section class="panel">${profileSummary()}</section>`}
function pageHead(title,sub){return `<div class="page-title"><div><div class="eyebrow">HELIX VIP MEMBER</div><h1>${title}</h1><p>${sub}</p></div></div>`}
function render(){nav();$('#content').innerHTML=page();$('#nav').querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page))}
async function load(){const{data:{session}}=await sb.auth.getSession();if(!session){location.replace('/vip/login');return}$('#user-email').textContent=session.user.email||'';$('#avatar').textContent=(session.user.email||'H')[0].toUpperCase();const{data:role,error}=await sb.rpc('helix_current_role');if(error){$('#content').innerHTML='<div class="notice">Sesi terverifikasi, tetapi data role tidak dapat dimuat.</div>';return}if(role==='admin'){location.replace('/vip/admin/');return}try{const r=await api('member');state.data=r;render()}catch(e){$('#content').innerHTML=`<div class="notice">${esc(e.message)}</div>`}}
async function reset(){const{data:{session}}=await sb.auth.getSession();const{error}=await sb.auth.resetPasswordForEmail(session.user.email,{redirectTo:new URL('/vip/login?flow=recovery',location.origin).href});if(error)throw error;toast('Link reset password dikirim oleh HELIX TEAM.')}
document.addEventListener('click',async e=>{const b=e.target.closest('button,[data-page]');if(!b)return;if(b.id==='menu')$('#sidebar').classList.toggle('open');if(b.dataset.page){state.page=b.dataset.page;render();scrollTo({top:0,behavior:'smooth'});$('#sidebar').classList.remove('open')}try{if(b.id==='logout'||b.hasAttribute('data-logout')){if(await HelixUI.confirm({title:'Akhiri sesi akun?',message:'Sesi akun pada perangkat ini akan diakhiri.',confirmText:'Keluar'})){await sb.auth.signOut();location.replace('/vip/login')}}if(b.hasAttribute('data-edit-profile-name')){const values=await HelixUI.modal({title:'Ubah nama profil',message:'Nama ini akan tampil pada profil HELIX Anda.',confirmText:'Lanjutkan',fields:[{name:'display_name',label:'Nama tampilan',type:'text',value:state.data.member.display_name||'',required:true,minLength:2,maxLength:80}]});if(values&&await HelixUI.confirm({title:'Konfirmasi perubahan nama',message:`Nama profil akan diubah menjadi ${values.display_name.trim()}.`,confirmText:'Simpan nama'})){const result=await api('member/profile',{display_name:values.display_name},'PATCH');state.data.member=result.member;render();toast('Nama profil berhasil diperbarui.')}}if(b.hasAttribute('data-reset')&&await HelixUI.confirm({title:'Kirim tautan reset password?',message:'HELIX TEAM akan mengirim email untuk membuat password baru.',confirmText:'Kirim tautan'}))await reset();if(b.dataset.download){const result=await api('member/materials/'+b.dataset.download);location.href=result.url}if(b.dataset.releaseBinding){const reason=await HelixUI.prompt({title:'Lepas akun MT5',message:'Setelah dilepas, slot license tersedia untuk akun lain.',label:'Alasan melepas akun (minimal 3 karakter)',required:true,minLength:3,maxLength:300});if(reason&&await HelixUI.confirm({title:'Konfirmasi pelepasan akun',message:'Akun ini akan dilepas dari license dan sesi terminal terkait dicabut.',confirmText:'Lepas akun',danger:true})){await api('member/bindings/'+b.dataset.releaseBinding,{action:'release',reason});state.data=await api('member');render();toast('Binding akun sudah dilepas.')}}if(b.hasAttribute('data-change-email')){const result=await HelixUI.modal({title:'Minta ganti email',message:'Alamat portal berubah setelah email baru diverifikasi oleh HELIX TEAM.',confirmText:'Kirim permintaan',fields:[{name:'email',label:'Alamat email baru',type:'email',required:true,maxLength:254}]});if(result&&await HelixUI.confirm({title:'Konfirmasi email baru',message:`Tautan verifikasi akan dikirim ke ${result.email}. Email login belum berubah sampai tautan dibuka.`,confirmText:'Kirim verifikasi'})){const{error}=await sb.auth.updateUser({email:result.email.trim()});if(error)throw error;toast('Permintaan perubahan email dikirim untuk konfirmasi.')}}}catch(err){toast(err.message,true)}});
$('#search').addEventListener('input',e=>{const term=e.target.value.toLowerCase();document.querySelectorAll('.item-row').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(term))});installHelixUi().catch(()=>{}).finally(()=>{document.documentElement.style.visibility='';load()});
</script></body></html>
