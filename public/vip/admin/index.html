dy=`<div class="field"><label>Nama Material</label><input name="title" required maxlength="180"></div><div class="field"><label>Deskripsi</label><textarea name="description"></textarea></div><div class="field"><label>Kategori</label><select name="kind"><option value="video">Video</option><option value="guide">Panduan</option><option value="file">File</option><option value="strategy">Strategi</option></select></div><div class="field"><label>Pilih file (maks. 50 MB)</label><input type="file" name="file" accept=".pdf,.mp4,.zip,.ex5,.png,.jpg,.jpeg,.webp,.txt,.mq5"><span class="field-help">File disimpan di Supabase Storage privat dan hanya bisa diunduh member login.</span></div><div class="field"><label>Atau gunakan URL HTTPS</label><input type="url" name="storage_path" placeholder="https://…"></div><label><input type="checkbox" name="published" checked> Terbitkan sekarang</label>`;$('#overlay').innerHTML=`<div class="modal-backdrop"><form class="modal" id="modal-form" data-kind="${kind}"><header class="modal-head"><div><div class="eyebrow">HELIX ADMIN</div><h2>${titles[kind]}</h2></div><button class="btn btn-quiet" type="button" data-close>✕</button></header><div class="modal-body">${body}<div class="message" id="modal-message" aria-live="polite"></div></div><footer class="modal-foot"><button class="btn btn-quiet" type="button" data-close>Batal</button><button class="btn btn-primary" type="submit" ${kind==='license'&&!state.data.members.some(x=>x.role==='member')?'disabled':''}>${kind==='member'?'Kirim Undangan':kind==='license'?'Generate License':'Simpan'}</button></footer></form></div>`}

.dataset.memberDelete,'DELETE');toast('Member dan data license terkait dihapus.');await refresh()}if(b.dataset.licenseDelete){const license=state.data.licenses.find(x=>x.id===b.dataset.licenseDelete);if(license&&!license.deleted_at){const reason=await HelixUI.prompt({title:'Hapus license member?',message:'License akan dicabut permanen dari penggunaan, seluruh sesi EA dicabut, dan slot akun dilepas. Riwayat audit tetap disimpan.',label:'Alasan penghapusan (wajib)',type:'text',minLength:3,maxLength:300});if(reason&&await HelixUI.confirm({title:'Konfirmasi penghapusan license',message:`License ${license.license_key_hint} tidak dapat dipakai lagi. Semua sesi EA aktif akan dicabut.`,confirmText:'Hapus license',danger:true})){const result=await api('admin/licenses/'+license.id,'PATCH',{action:'delete',reason});toast(`License dihapus; ${result.sessions_revoked} sesi EA dicabut.`);await refresh()}}}if(b.dataset.licenseStatus){const statusResult=await HelixUI.modal({title:'Ubah status license',message:'Perubahan langsung memengaruhi entitlement member. Alasan akan disimpan dalam audit.',confirmText:'Terapkan status',fields:[{name:'status',label:'Status baru',type:'select',value:b.dataset.status,options:['active','suspended','revoked','expired'].map(x=>({value:x,label:x}))},{name:'reason',label:'Alasan perubahan (wajib)',type:'textarea',required:true,minLength:3,maxLength:300}]});if(statusResult){if(!(await HelixUI.confirm({title:'Konfirmasi perubahan license',message:`Status license berubah dari ${b.dataset.status} menjadi ${statusResult.status}.`,confirmText:'Konfirmasi perubahan'})))return;await api('admin/licenses/'+b.dataset.licenseStatus,'PATCH',statusResult);toast('Status license diperbarui.');await refresh()}}if(b.dataset.licenseEdit){const expiryMode=b.dataset.activationPolicy==='first_activation'&&!b.dataset.firstActivated;const fields=[{name:'max_accounts',label:'Maksimum akun MT5 (1–5)',type:'number',value:b.dataset.slots,required:true,min:1,max:5},expiryMode?{name:'duration_days',label:'Masa aktif sejak aktivasi pertama (hari)',type:'number',value:b.dataset.durationDays||730,required:true,min:1,max:3650}:{name:'expires_at',label:'Tanggal expiry baru',type:'date',value:b.dataset.expires.slice(0,10),required:true},{name:'reason',label:'Alasan perubahan (wajib)',type:'textarea',required:true,minLength:3,maxLength:300}];const change=await HelixUI.modal({title:'Edit license',message:'Batas slot dan masa aktif akan diperbarui. Alasan disimpan dalam audit.',confirmText:'Lanjut ke konfirmasi',fields});if(change){const summary=`Slot akun: ${change.max_accounts}. ${expiryMode?`Durasi: ${change.duration_days} hari setelah aktivasi.`:`Expiry: ${change.expires_at}.`} Alasan: ${change.reason}`;if(!(await HelixUI.confirm({title:'Konfirmasi perubahan license',message:summary,confirmText:'Simpan perubahan'})))return;change.max_accounts=Number(change.max_accounts);if(expiryMode)change.duration_days=Number(change.duration_days);else change.expires_at=new Date(change.expires_at+'T23:59:59.000Z').toISOString();await api('admin/licenses/'+b.dataset.licenseEdit,'PATCH',change);toast('Expiry dan batas slot license diperbarui.');await refresh()}}if(b.dataset.licenseKey&&await HelixUI.confirm({title:'Rotasi license key?',message:'Key saat ini akan tidak berlaku dan tidak dapat dipulihkan.',confirmText:'Rotasi key',danger:true})){const r=await api('admin/licenses/'+b.dataset.licenseKey,'PATCH',{action:'rotate-key'});showKeyOnce(r.license_key,'Key license berhasil dirotasi');await refresh()}if(b.dataset.release){const detail=await HelixUI.prompt({title:'Lepas akun MT5',message:'Slot license akan tersedia kembali dan sesi terminal terkait dicabut. Masukkan alasan untuk audit.',label:'Alasan (minimal 3 karakter)',type:'text'});if(detail&&await HelixUI.confirm({title:'Konfirmasi pelepasan slot',message:'Binding akun MT5 akan dicabut dari license.',confirmText:'Lepas slot',danger:true})){await api('admin/licenses/'+b.dataset.release,'PATCH',{action:'release-slot',binding_id:b.dataset.binding,reason:detail});toast('Slot akun dilepas.');await refresh()}}if(b.dataset.toggleContent){const entity=b.dataset.toggleContent,id=b.dataset.id,publishing=b.dataset.published!=='true';if(await HelixUI.confirm({title:publishing?'Publikasikan konten?':'Tarik publikasi?',message:publishing?'Konten akan terlihat oleh seluruh member VIP.':'Konten tidak lagi terlihat oleh member VIP.',confirmText:publishing?'Publikasikan':'Tarik publikasi'})){await api(`admin/${entity==='announcement'?'announcements':'materials'}/${id}`,'PATCH',{published:publishing});toast('Status publikasi diperbarui.');await refresh()}}if(b.dataset.contentDelete){const entity=b.dataset.contentDelete==='announcement'?'announcements':'materials';if(await HelixUI.confirm({title:'Hapus konten?',message:'Item ini akan dihapus dan tidak bisa dipulihkan.',confirmText:'Hapus permanen',danger:true})){await api(`admin/${entity}/${b.dataset.id}`,'DELETE');toast('Konten dihapus.');await refresh()}}if(b.dataset.copyKey){await navigator.clipboard.writeText(b.dataset.copyKey);toast('License key disalin.')} }catch(err){toast(err.message,true)}});
