="1" ${memberPage>=totalPages?'disabled':''}>Berikutnya</button></div>`}`}

let accountPerformanceRows=[],accountPerformancePage=1;
function accountPerformanceTable(rows){if(!rows.length)return '<div class="empty">Belum ada data akun untuk filter ini.</div>';let previousMember='';const body=rows.map(a=>{const m=a.metrics||{},profit=m.status==='READY'?Number(m.net_pnl_usd).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):m.status==='UNSUPPORTED_CURRENCY'?'Tidak didukung':'-',memberKey=a.member_id||a.member_email,groupStart=memberKey!==previousMember;previousMember=memberKey;const first=a.first_recorded_trade_at?String(a.first_recorded_trade_at).replace('T',' ').slice(0,19):'-',lastSync=a.last_sync_at?new Date(a.last_sync_at).toLocaleString('id-ID'):'-',winrate=m.winrate==null?'-':Number(m.winrate).toFixed(2)+'%',factor=m.profit_factor==null?(m.status==='READY'?'infinity':'-'):Number(m.profit_factor).toFixed(4);return '<tr class="'+(groupStart?'admin-performance-member-start':'')+'"><td><strong>'+esc(a.member_name||'Member')+'</strong><div class="panel-sub">'+esc(a.member_email||'')+'</div><div class="panel-sub">'+esc(a.license||a.product_slug||'-')+'</div></td><td><strong>'+esc(a.broker_server||'-')+'</strong><div class="panel-sub">'+esc(a.account_login||'-')+'</div></td><td>'+esc(a.mode||'-')+'</td><td>'+(a.magic_base??'-')+'</td><td>'+badge(a.status)+'</td><td>'+first+'</td><td>'+lastSync+'</td><td>'+(m.total_closed_trades??0)+'</td><td>'+(m.wins??0)+' / '+(m.losses??0)+'</td><td>'+profit+'</td><td>'+winrate+'</td><td>'+factor+'</td></tr>'}).join('');return '<div class="table-wrap admin-performance-table-wrap"><table class="admin-performance-table"><thead><tr><th>Member / License / Akun</th><th>Broker / Login</th><th>Mode</th><th>Magic Base</th><th>Status</th><th>First Recorded Trade</th><th>Last Sync</th><th>Closed Trades</th><th>Win / Loss</th><th>Net Profit (USD)</th><th>WR</th><th>PF</th></tr></thead><tbody>'+body+'</tbody></table></div>'}
function fillAccountPerformanceFilters(rows){const memberNode=$('#account-perf-member'),accountNode=$('#account-perf-binding'),memberValue=memberNode?.value||'',accountValue=accountNode?.value||'';if(memberNode){const members=[...new Map(rows.map(x=>[x.member_id,x])).values()];memberNode.innerHTML='<option value="">Semua member</option>'+members.map(x=>`<option value="${esc(x.member_id)}">${esc(x.member_name||'Member')} | ${esc(x.member_email||'')}</option>`).join('');if(members.some(x=>x.member_id===memberValue))memberNode.value=memberValue}if(accountNode){const accounts=[...new Map(rows.map(x=>[x.binding_id,x])).values()];accountNode.innerHTML='<option value="">Semua akun</option>'+accounts.map(x=>`<option value="${esc(x.binding_id)}">${esc(x.broker_server)} | ${esc(x.account_login)} | ${esc(x.mode)}</option>`).join('');if(accounts.some(x=>x.binding_id===accountValue))accountNode.value=accountValue}}
function filterAccountPerformance(){const member=$('#account-perf-member')?.value,account=$('#account-perf-binding')?.value,search=($('#account-perf-search')?.value||'').trim().toLowerCase();return accountPerformanceRows.filter(x=>(!member||x.member_id===member)&&(!account||x.binding_id===account)&&(!search||[x.member_name,x.member_email,x.license,x.product_slug,x.broker_server,x.account_login,x.mode,x.magic_base].join(' ').toLowerCase().includes(search)))}
function renderAccountPerformance(){const host=$('#account-perf-results'),label=$('#account-perf-page-label');if(!host||!label)return;const rows=filterAccountPerformance(),memberIds=[...new Set(rows.map(x=>x.member_id||x.member_email))],totalPages=Math.max(1,Math.ceil(memberIds.length/15));accountPerformancePage=Math.min(accountPerformancePage,totalPages);const start=(accountPerformancePage-1)*15,pageMembers=new Set(memberIds.slice(start,start+15));host.innerHTML=accountPerformanceTable(rows.filter(x=>pageMembers.has(x.member_id||x.member_email)));label.textContent=`Halaman ${accountPerformancePage} dari ${totalPages} | ${memberIds.length} member | 15 member per halaman`;const prev=document.querySelector('[data-account-performance-page="-1"]'),next=document.querySelector('[data-account-performance-page="1"]');if(prev)prev.disabled=accountPerformancePage<=1;if(next)next.disabled=accountPerformancePage>=totalPages}
async function loadAccountPerformance(){const stateNode=$('#account-perf-state'),host=$('#account-perf-results');if(!stateNode||!host)return;stateNode.textContent='Memuat ledger Production...';stateNode.className='notice';try{const qs=new URLSearchParams({from:$('#account-perf-from')?.value||'2026-09-01'}),to=$('#account-perf-to')?.value;if(to){const end=new Date(`${to}T00:00:00Z`);end.setUTCDate(end.getUTCDate()+1);qs.set('to',end.toISOString().slice(0,10))}const data=await api(`admin/performance/accounts?${qs}`);accountPerformanceRows=data.accounts||[];fillAccountPerformanceFilters(accountPerformanceRows);if(data.applied_filters?.from&&$('#account-perf-from'))$('#account-perf-from').value=data.applied_filters.from.slice(0,10);renderAccountPerformance();const rates=data.currency_rates||{};stateNode.textContent=data.message||`${accountPerformanceRows.length} akun | ${data.status}.`;stateNode.className=data.status==='WAITING_FOR_EA_R7'?'notice':'notice ok';const note=$('.admin-performance-note');if(note)note.textContent=`Ledger server | 1 USD = ${Number(rates.usd_idr_rate||17500).toLocaleString('id-ID')} IDR | ${Number(rates.usc_per_usd||100).toLocaleString('id-ID')} USC = 1 USD. Hasil belum direkonsiliasi dengan History MT5.`}catch(error){stateNode.textContent=error.message;stateNode.className='notice error';host.innerHTML=''}}

function filterContent(type){const term=(document.querySelector(`[data-content-search="${type}"]`)?.value||'').trim().toLocaleLowerCase('id'),kind=document.querySelector(`[data-content-kind="${type}"]`)?.value||'';document.querySelectorAll(`[data-content-group="${type}"]`).forEach(group=>{let visible=0;group.querySelectorAll('[data-content-row]').forEach(row=>{const show=(!term||row.textContent.toLocaleLowerCase('id').includes(term))&&(!kind||row.dataset.kind===kind);row.hidden=!show;if(show)visible++});group.hidden=visible===0})}
function announcementRows(compact=false){const a=compact?state.data.announcements.slice(0,4):state.data.announcements;if(!a.length)return `<div class="empty"><strong>Belum ada pengumuman</strong>Buat pengumuman untuk member portal.</div>`;return `${compact?'':contentTools('announcement')}${Object.entries(contentKinds.announcement).map(([kind,label])=>{const items=a.filter(x=>x.kind===kind);return items.length?`<section class="content-category" data-content-group="announcement"><h3>${label}<span>${items.length}</span></h3><div class="table-wrap"><table><thead><tr><th>Judul</th><th>Kategori</th><th>Status</th><th>Tanggal</th><th>Aksi</th></tr></thead><tbody>${items.map(x=>`<tr data-filter-row data-content-row data-kind="${esc(x.kind)}"><td><strong>${esc(x.title)}</strong><div class="panel-sub">${esc(String(x.body).split(/\r?\n/).map(t=>t.trim()).find(Boolean)||'').slice(0,150)}</div></td><td>${label}</td><td>${badge(x.published?'published':'draft')}</td><td>${fmt(x.published_at||x.created_at)}</td><td><div class="row-actions"><button class="btn btn-quiet table-action" data-content-edit="announcement" data-id="${esc(x.id)}">Edit</button><button class="btn btn-quiet table-action" data-toggle-content="announcement" data-id="${esc(x.id)}" data-published="${x.published}">${x.published?'Unpublish':'Publish'}</button><button class="btn btn-danger table-action" data-content-delete="announcement" data-id="${esc(x.id)}">Hapus</button></div></td></tr>`).join('')}</tbody></table></div></section>`:''}).join('')}`}
function materialRows(compact=false){const a=compact?state.data.materials.slice(0,4):state.data.materials;if(!a.length)return `<div class="empty"><strong>Belum ada material</strong>Tambahkan panduan atau link file untuk member.</div>`;return `${compact?'':contentTools('material')}${Object.entries(contentKinds.material).map(([kind,label])=>{const items=a.filter(x=>x.kind===kind);return items.length?`<section class="content-category" data-content-group="material"><h3>${label}<span>${items.length}</span></h3><div class="table-wrap"><table><thead><tr><th>Nama Material</th><th>Kategori</th><th>File / Link</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${items.map(x=>{const url=safeUrl(x.storage_path),privateFile=x.storage_path?.startsWith('helix-vip-materials:');return `<tr data-filter-row data-content-row data-kind="${esc(x.kind)}"><td><strong>${esc(x.title)}</strong><div class="panel-sub">${esc(x.description).slice(0,150)}</div></td><td>${label}</td><td>${url?`<a class="gold" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Buka ↗</a>`:privateFile?'File privat':'—'}</td><td>${badge(x.published?'published':'draft')}</td><td><div class="row-actions"><button class="btn btn-quiet table-action" data-content-edit="material" data-id="${esc(x.id)}">Edit</button><button class="btn btn-quiet table-action" data-toggle-content="material" data-id="${esc(x.id)}" data-published="${x.published}">${x.published?'Unpublish':'Publish'}</button><button class="btn btn-danger table-action" data-content-delete="material" data-id="${esc(x.id)}">Hapus</button></div></td></tr>`}).join('')}</tbody></table></div></section>`:''}).join('')}`}

function bindingsTable(){const d=state.data,v18k=d.release_ack_v18k,b=v18k?d.bindings:d.bindings.filter(x=>!x.released_at);if(!b.length)return '<div class="empty">Belum ada akun MT5 yang diikat ke license.</div>';return `<div class="table-wrap"><table><thead><tr><th>Server</th><th>Login</th><th>Member / License</th><th>Mode</th>${v18k?'<th>Status / Terminal</th>':''}<th>Last Sync</th><th>Aksi</th></tr></thead><tbody>${b.map(x=>{const l=d.licenses.find(y=>y.id===x.license_id),m=d.members.find(y=>y.id===l?.member_id),status=x.binding_status||(x.released_at?'RELEASED':'ACTIVE'),terminal=x.terminal_status||'—';return `<tr data-filter-row><td>${esc(x.broker_server)}</td><td>${esc(x.account_login)}</td><td>${esc(m?.email||'—')}<div class="panel-sub">${esc(l?.license_key_hint||'')}</div></td><td>${esc(x.mode)}</td>${v18k?`<td>${esc(status)}<div class="panel-sub">Terminal ${esc(terminal)}</div></td>`:''}<td>${fmt(x.last_sync_at)}</td><td>${status==='RELEASED'?'<span class="panel-sub">—</span>':`<button class="btn btn-danger table-action" data-release="${l?.id}" data-binding="${x.id}">${v18k?'Force Release':'Lepas slot'}</button>`}</td></tr>`}).join('')}</tbody></table></div>`}
function eventTable(){const d=state.data;if(!d.events.length)return '<div class="empty">Belum ada event license tercatat.</div>';return `<div class="table-wrap"><table><thead><tr><th>Waktu</th><th>Peristiwa</th><th>Member / License</th><th>Detail</th></tr></thead><tbody>${d.events.map(e=>{const l=d.licenses.find(x=>x.id===e.license_id),m=d.members.find(x=>x.id===l?.member_id);return `<tr data-filter-row><td>${fmt(e.created_at)}</td><td>${badge(e.event_type)}</td><td>${esc(m?.email||'—')}<div class="panel-sub">${esc(l?.license_key_hint||'')}</div></td><td>${esc(JSON.stringify(e.metadata||{}))}</td></tr>`}).join('')}</tbody></table></div>`}

dy=`<div class="field"><label>Nama Material</label><input name="title" required maxlength="180"></div><div class="field"><label>Deskripsi</label><textarea name="description"></textarea></div><div class="field"><label>Kategori</label><select name="kind"><option value="video">Video</option><option value="guide">Panduan</option><option value="file">File</option><option value="strategy">Strategi</option></select></div><div class="field"><label>Pilih file (maks. 50 MB)</label><input type="file" name="file" accept=".pdf,.mp4,.zip,.ex5,.png,.jpg,.jpeg,.webp,.txt,.mq5"><span class="field-help">File disimpan di Supabase Storage privat dan hanya bisa diunduh member login.</span></div><div class="field"><label>Atau gunakan URL HTTPS</label><input type="url" name="storage_path" placeholder="https://…"></div><label><input type="checkbox" name="published" checked> Terbitkan sekarang</label>`;$('#overlay').innerHTML=`<div class="modal-backdrop"><form class="modal" id="modal-form" data-kind="${kind}"><header class="modal-head"><div><div class="eyebrow">HELIX ADMIN</div><h2>${titles[kind]}</h2></div><button class="btn btn-quiet" type="button" data-close>✕</button></header><div class="modal-body">${body}<div class="message" id="modal-message" aria-live="polite"></div></div><footer class="modal-foot"><button class="btn btn-quiet" type="button" data-close>Batal</button><button class="btn btn-primary" type="submit" ${kind==='license'&&!state.data.members.some(x=>x.role==='member')?'disabled':''}>${kind==='member'?'Kirim Undangan':kind==='license'?'Generate License':'Simpan'}</button></footer></form></div>`}

document.addEventListener('click',e=>{const b=e.target.closest('[data-content-edit]');if(!b)return;const type=b.dataset.contentEdit,source=type==='announcement'?state.data.announcements:state.data.materials,item=source.find(x=>x.id===b.dataset.id);if(item)editContentModal(type,item)});

document.addEventListener('input',e=>{const type=e.target.dataset.contentSearch;if(type)filterContent(type)});document.addEventListener('change',e=>{const type=e.target.dataset.contentKind;if(type)filterContent(type)});document.addEventListener('click',e=>{const b=e.target.closest('[data-member-page]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();memberPage=Math.max(1,memberPage+Number(b.dataset.memberPage));render()},true);document.addEventListener('input',e=>{if(e.target.id!=='filter'||state.page!=='Member')return;memberSearch=e.target.value.trim().toLowerCase();memberPage=1;render();const input=$('#filter');input?.focus();input?.setSelectionRange(input.value.length,input.value.length)});
</script></body></html>
