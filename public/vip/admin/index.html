0deg,#101419ed 12%,#10141988 50%,#10141933),url('/images/helix-mountain-scene.png') right 45%/cover}.hero-copy{position:relative;padding:27px 30px;max-width:780px}.eyebrow{color:var(--gold);font-weight:800;letter-spacing:2px;font-size:11px}.hero h1{font-size:34px;margin:7px 0}.hero p{color:#c5c8ca;margin:0;font-size:14px}.gold{color:var(--gold)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:15px 0}.stat,.card{background:linear-gradient(145deg,#151b1f,#0f1418);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 26px #0008}.stat{padding:15px 17px;position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:90px;height:90px;right:-30px;bottom:-48px;border-radius:50%;background:#efa92122;filter:blur(12px)}.stat span{color:#a9b0b4;font-size:12px}.stat strong{font-size:29px;display:block;margin:4px 0;color:#f6f3ec}.up{color:var(--green);font-size:10px;font-style:normal}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.card{padding:18px}.card h2{font-size:17px;color:var(--bright);margin:0 0 4px}.sub{color:var(--muted);font-size:12px;margin-bottom:14px}.product{min-height:216px;background:linear-gradient(90deg,#10161af2 12%,#10161aab 53%,#10161a2a),url('/images/helix-quadriga-v2.png') right center/cover}.product h2{font-size:27px;color:var(--gold);margin-top:14px}.product p{max-width:470px;color:#e0dfda;font-size:14px}.health{display:grid;gap:10px}.health-row{display:grid;grid-template-columns:1fr 55px 110px;align-items:center;gap:10px;padding:11px 12px;border:1px solid #29343a;border-radius:8px;color:#d0d4d4;font-size:12px}.health-row b{font-size:13px}.bar{height:6px;background:#28343a;border-radius:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#00d889,#a7ef64);border-radius:8px}.wide{margin-top:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btn{border:1px solid #946922;background:#1c1913;color:var(--bright);border-radius:7px;padding:10px 14px;cursor:pointer;font-size:12px}.btn.primary{background:linear-gradient(120deg,#ffdb76,#bd7b1f);color:#1b1102;font-weight:800}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:13px 9px;border-bottom:1px solid #2b3235;font-size:12px}th{color:#a9b0b4;text-transform:uppercase;font-size:10px;letter-spacing:1px}.pill{border:1px solid #276f51;background:#0d3024;color:#40df9b;border-radius:20px;padding:4px 8px;font-size:10px}.empty{padding:22px 0;color:#b4b9ba;font-size:13px}.footer{color:#687176;font-size:11px;text-align:center;margin-top:20px}.page-actions{display:flex;align-items:center;justify-content:space-between;gap:15px}.grid.content-grid{margin-top:14px}@media(max-width:1250px){.grid{grid-template-columns:1fr}.hero{min-height:165px}}@media(max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}}#app{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}#app>.hero,#app>.stats,#app>.grid,#app>.footer{grid-column:1/-1}#app>.wide{grid-column:span 6;margin-top:0}.side:after{content:"";position:absolute;z-index:-1;left:0;right:0;bottom:0;height:39%;background:linear-gradient(0deg,#07090be8 2%,#07090b22 55%,transparent),url("/images/helix-mountain-scene.png") 48% bottom/cover;opacity:.65;mask-image:linear-gradient(0deg,#000 0%,transparent 100%);pointer-events:none}.nav{position:relative;z-index:1}.hero{min-height:190px}.stat{min-height:105px}.product,.health{min-height:220px}.card{border-radius:13px}.wide table{min-width:550px}@media(max-width:1000px){#app>.wide{grid-column:1/-1}}@media(max-width:700px){#app{gap:10px}.side{width:72px;padding:17px 7px}.logo{font-size:0;text-align:center;padding:5px 0 30px}.logo:before{content:'H';font-size:25px}.logo small,.nav h5,.nav button span{display:none}.nav button{text-align:center;font-size:0;padding:14px 3px}.nav button:before{content:'◆';font-size:13px}.main{margin-left:72px;width:calc(100% - 72px)}.top{padding:12px </style></head><body><div class="shell"><aside class="side"><div class="logo">HELIX<small>ADMIN PANEL</small></div><nav class="nav"><h5>Workspace</h5><button class="active"><span>Dashboard</span></button><button><span>Member</span></button><button><span>License</span></button><h5>Content</h5><button><span>Announcement</span></button><button><span>Material</span></button></nav></aside><main class="main"><header class="top"><input class="search" placeholder="Cari member, license, announcement, atau material..."><div class="top-right"><span class="muted" id="who">Loading...</span><span class="avatar">A</span><button class="logout" id="logout">Logout</button></div></header><div class="content" id="app"><p class="muted">Memuat dashboard admin...</p></div></main></div><script>const sb=supabase.createClient('https://wouwoefzghecuiknznvs.supabase.co','sb_publishable_FDLLBcmYFGiS9PDbyvgDtQ_UWUB8fUc'),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));async function load(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='/vip/login';return}const{data:role}=await sb.rpc('helix_current_role');if(role!=='admin'){$('app').innerHTML='<p class="muted">Akun ini belum memiliki akses admin.</p>';return}$('who').textContent=session.user.email||'';const [mr,lr,ar,rr]=await Promise.all([sb.from('helix_members').select('display_name,email,role,created_at').order('created_at',{ascending:false}),sb.from('helix_licenses').select('license_key_hint,status,expires_at,max_accounts').order('created_at',{ascending:false}),sb.from('helix_announcements').select('title,kind,published,created_at').order('created_at',{ascending:false}),sb.from('helix_materials').select('title,kind,published,created_at').order('created_at',{ascending:false})]);const m=mr.data||[],l=lr.data||[],a=ar.data||[],mat=rr.data||[];const rows=(xs,cols)=>xs.length?`<div class="table"><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${xs.map(x=>`<tr>${cols.map(c=>`<td>${c[1](x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada data di database.</div>';$('app').innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">HELIX LICENSE OPERATIONS</div><h1>Selamat datang, <span class="gold">Admin</span></h1><p>Kelola member, license, pengumuman, dan material dalam satu panel.</p></div></section><section class="stats"><div class="stat"><span>Total Member</span><strong>${m.length}</strong><i class="up">Database live</i></div><div class="stat"><span>Total License</span><strong>${l.length}</strong><i class="up">Database live</i></div><div class="stat"><span>Aktivasi Aktif</span><strong>${l.filter(x=>x.status==='active').length}</strong><i class="up">Supabase RLS</i></div><div class="stat"><span>Published Content</span><strong>${a.filter(x=>x.published).length+mat.filter(x=>x.published).length}</strong><i class="up">Live content</i></div></section><div class="grid"><section class="card product"><h2>HELIX QUADRIGA</h2><p>Sistem trading multi-strategi untuk pengelolaan license dan entitlement member.</p><button class="btn primary">Kelola produk</button></section><section class="card"><h2>Ringkasan Sistem</h2><div class="sub">Status data yang terhubung</div><div class="health"><div class="health-row"><span>Supabase</span><b>Live</b><div class="bar"><i style="width:100%"></i></div></div><div class="health-row"><span>Member</span><b>${m.length}</b><div class="bar"><i style="width:${Math.min(m.length*10,100)}%"></i></div></div><div class="health-row"><span>License aktif</span><b>${l.filter(x=>x.status==='active').length}</b><div class="bar"><i style="width:${Math.min(l.length*10,100)}%"></i></div></div></div></section></div><section class="card wide"><h2>Manajemen Member</h2><div class="sub">Member yang tersimpan di Supabase</div><div class="actions"><button class="btn primary">+ Tambah Member</button><button class="btn">Suspend Member</button></div>${rows(m,[["Nama",x=>esc(x.display_name||'—')],["Email",x=>esc(x.email)],["Role",x=>esc(x.role)],["Terdaftar",x=>new Date(x.created_at).toLocaleDateString('id-ID')]])}</section><section class="card wide"><h2>Manajemen License</h2><div class="sub">License dan entitlement yang tersimpan di Supabase</div><div class="actions"><button class="btn primary">🔑 Generate License</button><button class="btn">Regenerate</button><button class="btn">Kirim Email</button></div>${rows(l,[["License key",x=>esc(x.license_key_hint)],["Status",x=>`<span class="pill">${esc(x.status)}</span>`],["Expiry",x=>new Date(x.expires_at).toLocaleDateString('id-ID')],["Slot",x=>x.max_accounts]])}</section><div class="grid"><section class="card"><h2>Announcement</h2>${rows(a,[["Judul",x=>esc(x.title)],["Jenis",x=>esc(x.kind)],["Status",x=>x.published?'Published':'Draft']])}</section><section class="card"><h2>Material</h2>${rows(mat,[["Judul",x=>esc(x.title)],["Jenis",x=>esc(x.kind)],["Status",x=>x.published?'Published':'Draft']])}</section></div><div class="footer">HELIX ADMIN PANEL · Supabase protected workspace</div>`}$('logout').onclick=async()=>{await sb.auth.signOut();location.href='/vip/login'};load();</script></body></html>
