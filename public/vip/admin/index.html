<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a0b"><title>HELIX Admin Panel</title><link rel="stylesheet" href="/vip/portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.admin-stats{grid-template-columns:repeat(4,minmax(0,1fr))}.section{margin-top:14px}.filterbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:10px 0 14px}.filterbar input,.filterbar select{max-width:270px}.dash-lower{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:13px}.table-action{padding:5px 8px;min-height:28px;font-size:9px}.copy-key{font-family:ui-monospace,monospace;color:#ffe19a;overflow-wrap:anywhere}.key-once{padding:14px;border:1px dashed #c49a3e;border-radius:9px;background:#211a0d;color:#ffe7ae;font-family:ui-monospace,monospace;overflow-wrap:anywhere}.side.active{background:#ffdb79;color:#160e02}@media(max-width:950px){.admin-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.dash-lower{grid-template-columns:1fr}}@media(max-width:760px){.sidebar .brand{padding-left:8px}.admin-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.table-action{font-size:9px}}
</style></head><body><div class="shell"><aside class="sidebar" id="sidebar"><div class="brand"><img src="/images/helix-emblem.webp" alt=""><div class="brand-name">HELIX<span class="brand-sub">ADMIN PANEL</span></div></div><div class="nav-label">Workspace</div><nav class="nav" id="nav"></nav><div class="sidebar-foot">TRADING TECHNOLOGY<br>FOR A SMARTER FUTURE<small>HELIX · Admin Console</small></div></aside><main class="main"><header class="topbar"><button class="mobile-menu" id="menu" aria-label="Buka menu">☰</button><label class="searchbox"><span>⌕</span><input id="search" placeholder="Cari member, license, pengumuman, material…"></label><div class="userbar"><div><div class="user-email" id="who">Memeriksa sesi…</div><span class="role-pill">♛ Super Admin</span></div><span class="avatar" id="avatar">A</span><button class="btn btn-primary" id="logout">Logout</button></div></header><div class="content" id="content"><div class="empty">Memuat workspace admin…</div></div></main></div><div id="overlay"></div><div id="toast-host"></div>
<script>
const sb=supabase.createClient('https://wouwoefzghecuiknznvs.supabase.co','sb_publishable_FDLLBcmYFGiS9PDbyvgDtQ_UWUB8fUc'),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),safeUrl=s=>{try{const u=new URL(s);return u.protocol==='https:'?u.href:''}catch{return ''}},fmt=d=>d?new Date(d).toLocaleDateString('id-ID',{dateStyle:'medium'}):'—';let state={page:'Dashboard',data:null};
const menus=[['Dashboard','⌂'],['Member','♙'],['License','⚿'],['Announcement','♢'],['Material','▤']];
function toast(text,error=false){const n=document.createElement('div');n.className='toast'+(error?' error':'');n.textContent=text;document.body.append(n);setTimeout(()=>n.remove(),5000)}
async function api(path,method='GET',body){const{data:{session}}=await sb.auth.getSession();const r=await fetch('/vip/api/'+path,{method,headers:{authorization:'Bearer '+session.access_token,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Permintaan gagal');return d}
function nav(){ $('#nav').innerHTML=menus.map(([name,ico])=>`<button data-page="${name}" class="${name===state.page?'active':''}"><span aria-hidden="true">${ico}</span>${name}</button>`).join('') }
function head(icon,title,sub,action=''){return `<div class="panel-head"><div><h2 class="panel-title"><span>${icon}</span>${title}</h2>${sub?`<div class="panel-sub">${sub}</div>`:''}</div>${action}</div>`}
function hero(){return `<section class="hero"><div class="hero-copy"><div class="eyebrow">HELIX LICENSE OPERATIONS</div><h1>Selamat datang, <span class="gold">Admin</span></h1><p>Kelola member, license, pengumuman, dan material dalam satu panel.</p></div></section>`}
function badge(status){const s=String(status||'—'),cls=['suspended','revoked','expired'].includes(s)?'bad':s==='active'||s==='published'?'':'warn';return `<span class="status ${cls}">${esc(s)}</span>`}
function stats(){const d=state.data;return `<section class="stats admin-stats"><article class="stat"><span class="stat-label">Total Member</span><strong class="stat-value">${d.members.length.toLocaleString('id-ID')}</strong><span class="stat-note">Database live</span></article><article class="stat"><span class="stat-label">Total License</span><strong class="stat-value">${d.licenses.length.toLocaleString('id-ID')}</strong><span class="stat-note">License diterbitkan</span></article><article class="stat"><span class="stat-label">Aktivasi Aktif</span><strong class="stat-value">${d.licenses.filter(x=>x.status==='active'&&new Date(x.expires_at)>new Date()).length}</strong><span class="stat-note">Supabase License Store</span></article><article class="stat"><span class="stat-label">Published Content</span><strong class="stat-value">${d.announcements.filter(x=>x.published).length+d.materials.filter(x=>x.published).length}</strong><span class="stat-note">Announcement + Material</span></article></section>`}
function productAndHealth(){const d=state.data,active=d.licenses.filter(x=>x.status==='active').length,activeBindings=d.bindings.filter(x=>!x.released_at).length;return `<div class="dashboard-grid"><section class="panel product-panel"><div class="eyebrow">HELIX · MT5 EXPERT ADVISOR</div><h2 class="panel-title" style="font-size:25px;margin-top:12px">HELIX QUADRIGA</h2><p>Sistem trading multi-strategi dengan manajemen entitlement, akun, dan license member.</p><span class="status">License service online</span></section><section class="panel">${head('▥','Ringkasan Sistem','Status data yang terhubung')}<div class="health-list"><div class="health-row"><span>◉</span><span>Supabase Auth & Database</span><b>Live</b><div class="bar"><i style="width:100%"></i></div></div><div class="health-row"><span>♙</span><span>Member portal</span><b>${d.members.length}</b><div class="bar"><i style="width:${Math.min(d.members.length*10,100)}%"></i></div></div><div class="health-row"><span>⚿</span><span>License aktif</span><b>${active}/${d.licenses.length}</b><div class="bar"><i style="width:${d.licenses.length?active/d.licenses.length*100:0}%"></i></div></div><div class="health-row"><span>▣</span><span>Akun terikat</span><b>${activeBindings}</b><div class="bar"><i style="width:${Math.min(activeBindings*10,100)}%"></i></div></div></div></section></div>`}
function memberTable(compact=false){const d=state.data,m=compact?d.members.slice(0,5):d.members;if(!m.length)return `<div class="empty"><strong>Belum ada member</strong>Tambahkan user melalui email undangan Supabase.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Member</th><th>Email</th><th>Role</th><th>Status</th><th>Terdaftar</th><th>Aksi</th></tr></thead><tbody>${m.map(x=>`<tr data-filter-row><td>${esc(x.display_name||'—')}</td><td>${esc(x.email)}</td><td>${badge(x.role)}</td><td>${x.banned_until&&new Date(x.banned_until)>new Date()?badge('suspended'):badge('active')}</td><td>${fmt(x.created_at)}</td><td><div class="row-actions"><button class="btn btn-quiet table-action" data-member-reset="${x.id}">Reset</button><button class="btn ${x.banned_until&&new Date(x.banned_until)>new Date()?'':'btn-danger'} table-action" data-member-ban="${x.id}" data-banned="${Boolean(x.banned_until&&new Date(x.banned_until)>new Date())}">${x.banned_until&&new Date(x.banned_until)>new Date()?'Pulihkan':'Suspend'}</button><button class="btn btn-danger table-action" data-member-delete="${x.id}" data-email="${esc(x.email)}">Hapus</button></div></td></tr>`).join('')}</tbody></table></div>`}
function licenseTable(compact=false){const d=state.data,l=compact?d.licenses.slice(0,5):d.licenses;if(!l.length)return `<div class="empty"><strong>Belum ada license</strong>Pilih member dan buat license pertama.</div>`;return `<div class="table-wrap"><table><thead><tr><th>License</th><th>Member</th><th>Produk</th><th>Expiry</th><th>Slot</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${l.map(x=>{const m=d.members.find(y=>y.id===x.member_id),used=d.bindings.filter(b=>b.license_id===x.id&&!b.released_at).length;return `<tr data-filter-row><td class="copy-key">${esc(x.license_key_hint)}</td><td>${esc(m?.email||'—')}</td><td>HELIX ${esc(x.product_slug).toUpperCase()}</td><td>${fmt(x.expires_at)}</td><td>${used}/${x.max_accounts}</td><td>${badge(x.status)}</td><td><div class="row-actions"><button class="btn btn-quiet table-action" data-license-status="${x.id}" data-status="${x.status}">Status</button><button class="btn btn-quiet table-action" data-license-edit="${x.id}" data-expires="${x.expires_at}" data-slots="${x.max_accounts}">Edit</button><button class="btn btn-quiet table-action" data-license-key="${x.id}">Rotate key</button></div></td></tr>`}).join('')}</tbody></table></div>`}
function announcementRows(compact=false){const a=compact?state.data.announcements.slice(0,4):state.data.announcements;if(!a.length)return `<div class="empty"><strong>Belum ada pengumuman</strong>Buat pengumuman untuk member portal.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Judul</th><th>Jenis</th><th>Status</th><th>Tanggal</th><th>Aksi</th></tr></thead><tbody>${a.map(x=>`<tr data-filter-row><td><strong>${esc(x.title)}</strong><div class="panel-sub">${esc(x.body).slice(0,100)}</div></td><td>${esc(x.kind)}</td><td>${badge(x.published?'published':'draft')}</td><td>${fmt(x.published_at||x.created_at)}</td><td><div class="row-actions"><button class="btn btn-quiet table-action" data-toggle-content="announcement" data-id="${x.id}" data-published="${x.published}">${x.published?'Unpublish':'Publish'}</button><button class="btn btn-danger table-action" data-content-delete="announcement" data-id="${x.id}">Hapus</button></div></td></tr>`).join('')}</tbody></table></div>`}
function materialRows(compact=false){const a=compact?state.data.materials.slice(0,4):state.data.materials;if(!a.length)return `<div class="empty"><strong>Belum ada material</strong>Tambahkan panduan atau link file untuk member.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Nama Material</th><th>Jenis</th><th>File / Link</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${a.map(x=>{const url=safeUrl(x.storage_path);return `<tr data-filter-row><td><strong>${esc(x.title)}</strong><div class="panel-sub">${esc(x.description).slice(0,90)}</div></td><td>${esc(x.kind)}</td><td>${url?`<a class="gold" href="${esc(url)}" target="_blank" rel="noopener">Buka ↗</a>`:'—'}</td><td>${badge(x.published?'published':'draft')}</td><td><div class="row-actions"><button class="btn btn-quiet table-action" data-toggle-content="material" data-id="${x.id}" data-published="${x.published}">${x.published?'Unpublish':'Publish'}</button><button class="btn btn-danger table-action" data-content-delete="material" data-id="${x.id}">Hapus</button></div></td></tr>`}).join('')}</tbody></table></div>`}
function dashboard(){return `${hero()}${stats()}${productAndHealth()}<div class="dash-lower"><section class="panel">${head('♙','Manajemen Member','Member dengan akses portal VIP.',`<button class="btn btn-primary" data-modal="member">＋ Tambah Member</button>`)}${memberTable(true)}<button class="btn" data-page="Member" style="margin-top:12px">Lihat semua member →</button></section><section class="panel">${head('⚿','Manajemen License','Entitlement dan akun trading.',`<button class="btn btn-primary" data-modal="license">＋ Generate License</button>`)}${licenseTable(true)}<button class="btn" data-page="License" style="margin-top:12px">Lihat semua license →</button></section></div><div class="content-grid"><section class="panel">${head('♢','Announcement','Info resmi untuk member.',`<button class="btn btn-primary" data-modal="announcement">＋ Buat</button>`)}${announcementRows(true)}<button class="btn" data-page="Announcement" style="margin-top:11px">Kelola pengumuman →</button></section><section class="panel">${head('▤','Material','Panduan dan tautan download.',`<button class="btn btn-primary" data-modal="material">＋ Tambah</button>`)}${materialRows(true)}<button class="btn" data-page="Material" style="margin-top:11px">Kelola material →</button></section></div>`}
function page(){const p=state.page;if(p==='Dashboard')return dashboard();if(p==='Member')return `${pageHead(p,'Undang member, atur akses, dan kirim tautan reset password.') }<section class="panel">${head('♙','Daftar Member','Invite email akan dikirim oleh Supabase Auth.',`<button class="btn btn-primary" data-modal="member">＋ Tambah Member</button>`)}<div class="filterbar"><input class="input" id="filter" placeholder="Cari nama atau email member"></div>${memberTable()}</section>`;if(p==='License')return `${pageHead(p,'Buat license, kelola masa aktif dan slot, suspend, revoke, atau rotasi key.') }<section class="panel">${head('⚿','License HELIX','License key utuh hanya terlihat satu kali saat dibuat/dirotasi.',`<button class="btn btn-primary" data-modal="license">＋ Generate License</button>`)}<div class="filterbar"><input class="input" id="filter" placeholder="Cari license atau email member"></div>${licenseTable()}</section><section class="panel section">${head('▣','Akun MT5 pada license','Reset/release slot melepas binding akun yang dipilih.')}${bindingsTable()}</section>`;if(p==='Announcement')return `${pageHead(p,'Informasi versi, maintenance, dan pemberitahuan member.') }<section class="panel">${head('♢','Semua Announcement','Publish/unpublish langsung mengatur visibilitas member.',`<button class="btn btn-primary" data-modal="announcement">＋ Buat Announcement</button>`)}${announcementRows()}</section>`;return `${pageHead(p,'Materi, panduan instalasi, setup WebRequest, dan link download.') }<section class="panel">${head('▤','Semua Material','Gunakan link HTTPS file publik/private yang sudah diatur di Storage.',`<button class="btn btn-primary" data-modal="material">＋ Tambah Material</button>`)}${materialRows()}</section>`}
function pageHead(title,copy){return `<div class="page-title"><div><div class="eyebrow">HELIX ADMIN CONSOLE</div><h1>${title}</h1><p>${copy}</p></div></div>`}
function bindingsTable(){const d=state.data,b=d.bindings.filter(x=>!x.released_at);if(!b.length)return '<div class="empty">Belum ada akun MT5 yang diikat ke license.</div>';return `<div class="table-wrap"><table><thead><tr><th>Server</th><th>Login</th><th>Member / License</th><th>Mode</th><th>Last Sync</th><th>Aksi</th></tr></thead><tbody>${b.map(x=>{const l=d.licenses.find(y=>y.id===x.license_id),m=d.members.find(y=>y.id===l?.member_id);return `<tr data-filter-row><td>${esc(x.broker_server)}</td><td>${esc(x.account_login)}</td><td>${esc(m?.email||'—')}<div class="panel-sub">${esc(l?.license_key_hint||'')}</div></td><td>${esc(x.mode)}</td><td>${fmt(x.last_sync_at)}</td><td><button class="btn btn-danger table-action" data-release="${l?.id}" data-binding="${x.id}">Release slot</button></td></tr>`}).join('')}</tbody></table></div>`}
function render(){nav();$('#content').innerHTML=page();$('#nav').querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));}
async function load(){const{data:{session}}=await sb.auth.getSession();if(!session){location.replace('/vip/login');return}$('#who').textContent=session.user.email||'';$('#avatar').textContent=(session.user.email||'A')[0].toUpperCase();const{data:role,error}=await sb.rpc('helix_current_role');if(error){$('#content').innerHTML='<div class="notice">Gagal memverifikasi role admin.</div>';return}if(role!=='admin'){location.replace('/vip/');return}try{state.data=await api('admin');render()}catch(e){$('#content').innerHTML=`<div class="notice">${esc(e.message)}</div>`}}
async function refresh(){state.data=await api('admin');render()}
function modal(kind){const titles={member:'Undang Member Baru',license:'Generate License HELIX',announcement:'Buat Announcement',material:'Tambah Material'};let body='';if(kind==='member')body=`<div class="field"><label>Nama Member</label><input name="display_name" required placeholder="Nama lengkap"></div><div class="field"><label>Email</label><input type="email" name="email" required placeholder="member@email.com"><span class="field-help">Tautan aktivasi dikirim ke email ini melalui Supabase Auth. Member menentukan password sendiri.</span></div>`;if(kind==='license')body=`<div class="field"><label>Email Member</label><select name="email" required>${state.data.members.filter(x=>x.role==='member').map(x=>`<option value="${esc(x.email)}">${esc(x.display_name||x.email)} · ${esc(x.email)}</option>`).join('')}</select></div><div class="field"><label>Produk</label><select name="product_slug"><option value="quadriga">HELIX QUADRIGA</option></select></div><div class="filterbar"><div class="field"><label>Masa aktif (hari)</label><input type="number" name="expiry_days" value="730" min="1" max="3650" required></div><div class="field"><label>Maksimum slot akun MT5</label><input type="number" name="max_accounts" value="5" min="1" max="50" required></div></div>${state.data.members.filter(x=>x.role==='member').length?'':'<div class="notice">Belum ada member non-admin. Invite member terlebih dahulu.</div>'}`;if(kind==='announcement')body=`<div class="field"><label>Judul</label><input name="title" required maxlength="180"></div><div class="field"><label>Isi pengumuman</label><textarea name="body" required></textarea></div><div class="field"><label>Kategori</label><select name="kind"><option value="update">Pembaruan Produk</option><option value="maintenance">Maintenance</option><option value="information">Informasi</option><option value="general">Umum</option></select></div><label><input type="checkbox" name="published" checked> Terbitkan sekarang</label>`;if(kind==='material')body=`<div class="field"><label>Nama Material</label><input name="title" required maxlength="180"></div><div class="field"><label>Deskripsi</label><textarea name="description"></textarea></div><div class="field"><label>Kategori</label><select name="kind"><option value="video">Video</option><option value="guide">Panduan</option><option value="file">File</option><option value="strategy">Strategi</option></select></div><div class="field"><label>URL file / materi (HTTPS)</label><input type="url" name="storage_path" placeholder="https://…"><span class="field-help">Upload berkas ke storage terlebih dahulu, lalu tempelkan URL yang bisa diakses member.</span></div><label><input type="checkbox" name="published" checked> Terbitkan sekarang</label>`;$('#overlay').innerHTML=`<div class="modal-backdrop"><form class="modal" id="modal-form" data-kind="${kind}"><header class="modal-head"><div><div class="eyebrow">HELIX ADMIN</div><h2>${titles[kind]}</h2></div><button class="btn btn-quiet" type="button" data-close>✕</button></header><div class="modal-body">${body}<div class="message" id="modal-message" aria-live="polite"></div></div><footer class="modal-foot"><button class="btn btn-quiet" type="button" data-close>Batal</button><button class="btn btn-primary" type="submit" ${kind==='license'&&!state.data.members.some(x=>x.role==='member')?'disabled':''}>${kind==='member'?'Kirim Undangan':kind==='license'?'Generate License':'Simpan'}</button></footer></form></div>`}
function showKeyOnce(key,title='License key baru'){ $('#overlay').innerHTML=`<div class="modal-backdrop"><section class="modal"><header class="modal-head"><div><div class="eyebrow">TAMPIL SEKALI</div><h2>${title}</h2></div><button class="btn btn-quiet" data-close>✕</button></header><div class="modal-body"><div class="notice">Simpan key ini sekarang. Demi keamanan, database hanya menyimpan hash dan petunjuk key.</div><div class="key-once">${esc(key)}</div><button class="btn btn-primary" data-copy-key="${esc(key)}">Salin license key</button></div><footer class="modal-foot"><button class="btn btn-primary" data-close>Selesai</button></footer></section></div>`}
async function submitForm(form){const kind=form.dataset.kind,fd=new FormData(form),data=Object.fromEntries(fd.entries());data.published=fd.has('published');const message=$('#modal-message');const button=form.querySelector('[type=submit]');button.disabled=true;message.textContent='Menyimpan ke server…';try{let path='admin/',r;if(kind==='member'){r=await api(path+'members','POST',data);toast(r.message);$('#overlay').innerHTML='';await refresh();return}if(kind==='license'){r=await api(path+'licenses','POST',data);showKeyOnce(r.license_key,'License berhasil dibuat');await refresh();return}if(kind==='announcement')await api(path+'announcements','POST',data);if(kind==='material')await api(path+'materials','POST',data);$('#overlay').innerHTML='';toast('Data berhasil disimpan.');await refresh()}catch(e){message.textContent=e.message;message.className='message'}finally{button.disabled=false}}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.id==='menu')$('#sidebar').classList.toggle('open');if(b.dataset.page){state.page=b.dataset.page;render();$('#sidebar').classList.remove('open');scrollTo({top:0,behavior:'smooth'})}if(b.id==='logout'){await sb.auth.signOut();location.replace('/vip/login')}if(b.dataset.modal)modal(b.dataset.modal);if(b.hasAttribute('data-close'))$('#overlay').innerHTML='';if(b.dataset.memberReset){await api('admin/members/'+b.dataset.memberReset,'POST',{action:'reset'});toast('Link reset password dikirim melalui Supabase Auth.')}if(b.dataset.memberBan){const banned=b.dataset.banned==='true';await api('admin/members/'+b.dataset.memberBan,'POST',{action:banned?'unsuspend':'suspend'});toast(banned?'Akses member dipulihkan.':'Member disuspend.');await refresh()}if(b.dataset.memberDelete){if(confirm(`Hapus ${b.dataset.email} beserta license dan akun yang terkait? Tindakan ini tidak dapat dibatalkan.`)){await api('admin/members/'+b.dataset.memberDelete,'DELETE');toast('Member dan data license terkait dihapus.');await refresh()}}if(b.dataset.licenseStatus){const current=b.dataset.status;const status=prompt('Pilih status: active, suspended, revoked, expired',current);if(status&&['active','suspended','revoked','expired'].includes(status)){await api('admin/licenses/'+b.dataset.licenseStatus,'PATCH',{status});toast('Status license diperbarui.');await refresh()}}if(b.dataset.licenseEdit){const slots=prompt('Maksimum akun MT5 (1–50):',b.dataset.slots);if(slots===null)return;const expiry=prompt('Expiry baru (format YYYY-MM-DD):',b.dataset.expires.slice(0,10));if(expiry===null)return;await api('admin/licenses/'+b.dataset.licenseEdit,'PATCH',{max_accounts:Number(slots),expires_at:new Date(expiry+'T23:59:59.000Z').toISOString()});toast('Expiry dan batas slot license diperbarui.');await refresh()}if(b.dataset.licenseKey){const r=await api('admin/licenses/'+b.dataset.licenseKey,'PATCH',{action:'rotate-key'});showKeyOnce(r.license_key,'Key license berhasil dirotasi');await refresh()}if(b.dataset.release){if(confirm('Lepas akun ini dari slot license?')){await api('admin/licenses/'+b.dataset.release,'PATCH',{action:'release-slot',binding_id:b.dataset.binding});toast('Slot akun dilepas.');await refresh()}}if(b.dataset.toggleContent){const entity=b.dataset.toggleContent,id=b.dataset.id;await api(`admin/${entity==='announcement'?'announcements':'materials'}/${id}`,'PATCH',{published:b.dataset.published!=='true'});toast('Status publikasi diperbarui.');await refresh()}if(b.dataset.contentDelete){const entity=b.dataset.contentDelete==='announcement'?'announcements':'materials';if(confirm('Hapus item konten ini?')){await api(`admin/${entity}/${b.dataset.id}`,'DELETE');toast('Konten dihapus.');await refresh()}}if(b.dataset.copyKey){await navigator.clipboard.writeText(b.dataset.copyKey);toast('License key disalin.')} }catch(err){toast(err.message,true)}});
document.addEventListener('submit',e=>{if(e.target.id==='modal-form'){e.preventDefault();submitForm(e.target)}});document.addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))$('#overlay').innerHTML=''});$('#search').addEventListener('input',e=>{const term=e.target.value.toLowerCase();document.querySelectorAll('[data-filter-row]').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(term))});load();
</script></body></html>
