<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HELIX Admin · Live</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#080a0d;color:#f4f1e8;font:14px system-ui;padding:28px}.wrap{max-width:1200px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #473619;padding-bottom:20px}.brand{color:#ffe19b;font-size:25px;letter-spacing:4px;font-weight:800}.muted{color:#a6adb3;font-size:12px}.gold{color:#f2bf5c}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.card{background:#14191e;border:1px solid #4a381d;border-radius:14px;padding:18px}.card strong{display:block;font-size:26px;margin-top:7px}.section{margin-top:18px}.section h2{color:#ffe19b;font-size:16px}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{text-align:left;padding:12px 8px;border-bottom:1px solid #2b3034;font-size:12px}.table th{color:#929aa1;font-size:10px;text-transform:uppercase}.pill{padding:4px 8px;border-radius:20px;border:1px solid #2b805d;color:#45d99d;background:#0b2d21;font-size:10px}.btn{border:1px solid #e0ad4e;background:linear-gradient(120deg,#ffe092,#bd7b1e);color:#1d1305;border-radius:8px;padding:9px 13px;font-weight:700;cursor:pointer}.error{color:#ff9499}.empty{padding:20px;color:#a6adb3}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.top{gap:14px;align-items:flex-start;flex-direction:column}}@media(max-width:450px){.cards{grid-template-columns:1fr 1fr}.card{padding:12px}.card strong{font-size:21px}}</style></head><body><main class="wrap"><header class="top"><div><div class="brand">HELIX</div><div class="gold">LIVE ADMIN CONSOLE</div></div><div><span class="muted" id="who">Checking session...</span> <button class="btn" id="logout">Logout</button></div></header><div id="app"><p class="muted">Loading secure admin data...</p></div></main><script>const sb=supabase.createClient('https://wouwoefzghecuiknznvs.supabase.co','sb_publishable_FDLLBcmYFGiS9PDbyvgDtQ_UWUB8fUc'),$=id=>document.getElementById(id);async function load(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='/vip/login';return}const{data:me}=await sb.from('helix_members').select('display_name,email,role').eq('id',session.user.id).single();if(!me||me.role!=='admin'){ $('app').innerHTML='<p class="error">Akun ini belum memiliki role admin.</p>';return}$('who').textContent=me.email;const [members,licenses,announcements,materials]=await Promise.all([sb.from('helix_members').select('id,display_name,email,role,created_at').order('created_at',{ascending:false}),sb.from('helix_licenses').select('id,license_key_hint,status,expires_at,max_accounts,member_id').order('created_at',{ascending:false}),sb.from('helix_announcements').select('id,title,kind,published,created_at').order('created_at',{ascending:false}),sb.from('helix_materials').select('id,title,kind,published,created_at').order('created_at',{ascending:false})]);const m=members.data||[],l=licenses.data||[],a=announcements.data||[],mat=materials.data||[];const rows=(xs,cols)=>xs.length?`<div class="table"><table><thead><tr>${cols.map(x=>`<th>${x[0]}</th>`).join('')}</tr></thead><tbody>${xs.map(x=>`<tr>${cols.map(c=>`<td>${c[1](x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada data.</div>';$('app').innerHTML=`<section class="cards"><div class="card"><span class="muted">Total Member</span><strong>${m.length}</strong></div><div class="card"><span class="muted">Total License</span><strong>${l.length}</strong></div><div class="card"><span class="muted">License Aktif</span><strong>${l.filter(x=>x.status==='active').length}</strong></div><div class="card"><span class="muted">Published Content</span><strong>${a.filter(x=>x.published).length+mat.filter(x=>x.published).length}</strong></div></section><section class="card section"><h2>Member</h2>${rows(m,[["Email",x=>x.email],["Nama",x=>x.display_name||'—'],["Role",x=>x.role],["Terdaftar",x=>new Date(x.created_at).toLocaleDateString('id-ID')]])}</section><section class="card section"><h2>License</h2>${rows(l,[["Key",x=>x.license_key_hint],["Status",x=>`<span class="pill">${x.status}</span>`],["Expiry",x=>new Date(x.expires_at).toLocaleDateString('id-ID')],["Slot",x=>x.max_accounts]])}</section><section class="card section"><h2>Announcement & Material</h2>${rows([...a.map(x=>({...x,source:'Announcement'})),...mat.map(x=>({...x,source:'Material'}))],[["Judul",x=>x.title],["Jenis",x=>x.source],["Status",x=>x.published?'Published':'Draft'],["Dibuat",x=>new Date(x.created_at).toLocaleDateString('id-ID')]])}</section>`}$('logout').onclick=async()=>{await sb.auth.signOut();location.href='/vip/login'};load();</script></body></html>
