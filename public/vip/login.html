<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · HELIX VIP Member</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090b0e;color:#f5f1e8;font:14px system-ui}.card{width:min(410px,calc(100% - 32px));padding:32px;border:1px solid #60471f;border-radius:20px;background:#14191e;box-shadow:0 25px 80px #0009}.brand{font-size:25px;letter-spacing:5px;color:#ffe1a0;font-weight:800}.sub{color:#f2bf5c;font-size:9px;letter-spacing:2px;margin-top:4px}.eyebrow{color:#f2bf5c;font-size:10px;letter-spacing:2px;font-weight:800;margin-top:38px}.title{font-size:28px;margin:7px 0}.hint{color:#a5abb0;font-size:12px;line-height:1.7}.field{display:grid;gap:7px;margin:18px 0}.field label{color:#c2c7ca;font-size:11px}.field input{padding:13px;border:1px solid #39434a;border-radius:9px;background:#0b1014;color:#fff}.btn{width:100%;border:1px solid #e8b34e;border-radius:9px;padding:13px;background:linear-gradient(120deg,#ffe092,#bd7b1e);font-weight:800;cursor:pointer}.link{border:0;background:transparent;color:#f2bf5c;cursor:pointer;margin-top:16px}.msg{min-height:24px;margin-top:15px;color:#ff9da2;font-size:12px}.ok{color:#45d99d}.fine{color:#778188;font-size:10px;line-height:1.7;margin-top:25px}</style></head><body><main class="card"><div class="brand">HELIX<div class="sub">VIP MEMBER PORTAL</div></div><div class="eyebrow">INVITED MEMBERS ONLY</div><h1 class="title">Masuk ke portal VIP</h1><p class="hint">Akun dibuat oleh Admin HELIX. Jika Anda belum menerima undangan, hubungi admin untuk mengirimkan link aktivasi.</p><form id="login"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn">Masuk</button></form><button class="link" id="reset" type="button">Lupa password? Kirim link reset</button><div class="msg" id="msg"></div><p class="fine">Registrasi mandiri dinonaktifkan. Admin mengundang akun melalui email; password hanya dibuat oleh pemilik akun.</p></main><script>const client=supabase.createClient('https://wouwoefzghecuiknznvs.supabase.co','sb_publishable_FDLLBcmYFGiS9PDbyvgDtQ_UWUB8fUc'),$=id=>document.getElementById(id),msg=$('msg');$('login').onsubmit=async e=>{e.preventDefault();msg.className='msg';msg.textContent='Memproses...';const{error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){msg.textContent=error.message;return}location.href='/vip/'};$('reset').onclick=async()=>{const email=$('email').value.trim();if(!email){msg.textContent='Masukkan email terlebih dahulu.';return}const{error}=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/vip/reset-password'});msg.className='msg '+(error?'':'ok');msg.textContent=error?error.message:'Link reset password sudah dikirim. Cek email Anda.'};</script></body></html>
